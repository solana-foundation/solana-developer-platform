packages:
  - apps/*
  - packages/*

catalog:
  # Kit 7: what kora, subscriptions, surfpool and the @solana-program clients already peer; @solana/pay is the holdout, covered by peerDependencyRules.
  '@solana-program/system': 0.13.0
  '@solana-program/token': 0.15.0
  '@solana-program/token-2022': 0.15.0
  '@solana/addresses': 7.1.1
  '@solana/codecs': 7.1.1
  '@solana/instructions': 7.1.1
  '@solana/keys': 7.1.1
  '@solana/kit': 7.1.1
  '@solana/mosaic-sdk': 0.2.0
  '@solana/programs': 7.1.1
  '@solana/rpc': 7.1.1
  '@solana/signers': 7.1.1
  '@solana/sysvars': 7.1.1
  '@solana/transactions': 7.1.1

# A strict resolve fails on peer ranges this repo does not control (typescript ^5 vs 6, kora's kit-plugin-* peers, klend's kit ^3); flipping it needs its own PR.
strictPeerDependencies: false

saveExact: true
engineStrict: true
preferOffline: true

# 7-day cooldown on new releases.
minimumReleaseAge: 10080
# pnpm 10.16 matches minimumReleaseAgeExclude by exact dependency alias.
# Keep @solana packages explicit until this workspace can rely on scoped wildcard exclusions.
minimumReleaseAgeExclude:
  # Veda's SVM SDK ships as pre-release alphas cut for this integration, so the
  # cooldown can block the exact version packages/sdp-veda pins. The cooldown
  # exists to keep a compromised release from being pulled in unnoticed; that
  # risk is answered by the pin itself, which is a gate rather than a habit:
  # `saveExact: true` above plus scripts/check-pinned-dependency-versions.mjs
  # (the "Pinned Dependency Policy" CI job) reject any non-exact direct
  # dependency, and its regex admits prerelease tags. A new publish therefore
  # cannot reach this repo without a lockfile change under review.
  - '@vedatech/svm-sdk'
  - '@solana/accounts'
  - '@solana/addresses'
  - '@solana/assertions'
  - '@solana/codecs'
  - '@solana/codecs-core'
  - '@solana/codecs-data-structures'
  - '@solana/codecs-numbers'
  - '@solana/codecs-strings'
  - '@solana/design-system'
  - '@solana/errors'
  - '@solana/fast-stable-stringify'
  - '@solana/fixed-points'
  - '@solana/functional'
  - '@solana/instruction-plans'
  - '@solana/instructions'
  - '@solana/keychain'
  - '@solana/keychain-aws-kms'
  - '@solana/keychain-cdp'
  - '@solana/keychain-core'
  - '@solana/keychain-crossmint'
  - '@solana/keychain-dfns'
  - '@solana/keychain-fireblocks'
  - '@solana/keychain-gcp-kms'
  - '@solana/keychain-memory'
  - '@solana/keychain-openfort'
  - '@solana/keychain-para'
  - '@solana/keychain-privy'
  - '@solana/keychain-test-utils'
  - '@solana/keychain-turnkey'
  - '@solana/keychain-utila'
  - '@solana/keychain-vault'
  - '@solana/keys'
  - '@solana/kit'
  - '@solana/kit-plugin-instruction-plan'
  - '@solana/kit-plugin-payer'
  - '@solana/kit-plugin-rpc'
  - '@solana/kora'
  - '@solana/mosaic-sdk'
  - '@solana/nominal-types'
  - '@solana/offchain-messages'
  - '@solana/options'
  - '@solana/plugin-core'
  - '@solana/plugin-interfaces'
  - '@solana/program-client-core'
  - '@solana/programs'
  - '@solana/promises'
  - '@solana/rpc'
  - '@solana/rpc-api'
  - '@solana/rpc-parsed-types'
  - '@solana/rpc-spec'
  - '@solana/rpc-spec-types'
  - '@solana/rpc-subscriptions'
  - '@solana/rpc-subscriptions-api'
  - '@solana/rpc-subscriptions-channel-websocket'
  - '@solana/rpc-subscriptions-spec'
  - '@solana/rpc-transformers'
  - '@solana/rpc-transport-http'
  - '@solana/rpc-types'
  - '@solana/signers'
  - '@solana/subscribable'
  - '@solana/subscriptions'
  - '@solana/surfpool'
  - '@solana/surfpool-darwin-arm64'
  - '@solana/surfpool-darwin-x64'
  - '@solana/surfpool-linux-x64-gnu'
  - '@solana/sysvars'
  - '@solana/token-acl-gate-sdk'
  - '@solana/transaction-confirmation'
  - '@solana/transaction-messages'
  - '@solana/transactions'
  # A 2014 release whose registry metadata carries no "time" field, so the age
  # gate can never clear it. Reached only as a transitive dev dependency of
  # vitest. Excluded rather than relaxing the gate for the whole workspace.
  - 'stackback'
