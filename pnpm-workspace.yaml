packages:
  - apps/*
  - packages/*

catalog:
  # Kit 8: what the @solana-program clients peer (token / token-2022 / system already
  # declare ^8) and what @solana/mosaic-sdk builds its confidential transaction-v1
  # planner on. The holdouts are @solana/pay (^6) and @solana/kora, subscriptions,
  # surfpool and the kit plugins (^7) — all covered by peerDependencyRules, and kora
  # is only ever handed encoded wire bytes, never a kit object.
  '@solana-program/system': 0.14.1
  '@solana-program/token': 0.16.1
  # Held at 0.16.1, not moved to the 0.18.0 that @solana/mosaic-sdk pins: 0.18.0
  # published 2026-09-16 and is still inside this workspace's 7-day release cooldown,
  # and nothing here needs it — SDP uses only stable core exports (decodeMint,
  # getMintSize, the metadata instruction, the program address), and every confidential
  # helper is reached through mosaic, which carries its own 0.18.0. Move this to 0.18.0
  # when the mosaic override below is swapped for the published release, so the tree
  # settles on one copy.
  '@solana-program/token-2022': 0.16.1
  '@solana/addresses': 8.3.0
  '@solana/codecs': 8.3.0
  '@solana/instruction-plans': 8.3.0
  '@solana/instructions': 8.3.0
  '@solana/keys': 8.3.0
  '@solana/kit': 8.3.0
  # TEMPORARY: the confidential surface this repo compiles against is not published
  # yet. solana-foundation/mosaic#85 (Kit v8, token-2022 0.18, wallet-only key
  # derivation, transaction-v1 planning, confidential mint/burn) carries `major`
  # changesets, so it will publish as 1.0.0 — 0.2.0 below is only what the pin check
  # reads. The `@solana/mosaic-sdk` override in the root package.json points at a
  # local build of that branch and is what actually resolves. Drop the override and
  # set this to 1.0.0 the moment the release lands.
  '@solana/mosaic-sdk': 0.2.0
  '@solana/programs': 8.3.0
  '@solana/rpc': 8.3.0
  '@solana/signers': 8.3.0
  '@solana/sysvars': 8.3.0
  '@solana/token-acl-sdk': 0.4.0
  '@solana/transactions': 8.3.0

# A strict resolve fails on peer ranges this repo does not control (typescript ^5 vs 6, kora's kit-plugin-* peers, klend's kit ^3); flipping it needs its own PR.
strictPeerDependencies: false

saveExact: true
engineStrict: true
preferOffline: true

# 7-day cooldown on new releases.
minimumReleaseAge: 10080
# pnpm 10.16 matches minimumReleaseAgeExclude by exact dependency alias.
# Keep @solana packages explicit until this workspace can rely on scoped wildcard exclusions.
minimumReleaseAgeExclude:
  # Veda's SVM SDK ships as pre-release alphas cut for this integration, so the
  # cooldown can block the exact version packages/sdp-veda pins. The cooldown
  # exists to keep a compromised release from being pulled in unnoticed; that
  # risk is answered by the pin itself, which is a gate rather than a habit:
  # `saveExact: true` above plus scripts/check-pinned-dependency-versions.mjs
  # (the "Pinned Dependency Policy" CI job) reject any non-exact direct
  # dependency, and its regex admits prerelease tags. A new publish therefore
  # cannot reach this repo without a lockfile change under review.
  - '@vedatech/svm-sdk'
  - '@solana/accounts'
  - '@solana/addresses'
  - '@solana/assertions'
  - '@solana/codecs'
  - '@solana/codecs-core'
  - '@solana/codecs-data-structures'
  - '@solana/codecs-numbers'
  - '@solana/codecs-strings'
  - '@solana/design-system'
  - '@solana/errors'
  - '@solana/fast-stable-stringify'
  - '@solana/fixed-points'
  - '@solana/functional'
  - '@solana/instruction-plans'
  - '@solana/instructions'
  - '@solana/keychain'
  - '@solana/keychain-aws-kms'
  - '@solana/keychain-cdp'
  - '@solana/keychain-core'
  - '@solana/keychain-crossmint'
  - '@solana/keychain-dfns'
  - '@solana/keychain-fireblocks'
  - '@solana/keychain-gcp-kms'
  - '@solana/keychain-memory'
  - '@solana/keychain-openfort'
  - '@solana/keychain-para'
  - '@solana/keychain-privy'
  - '@solana/keychain-test-utils'
  - '@solana/keychain-turnkey'
  - '@solana/keychain-utila'
  - '@solana/keychain-vault'
  - '@solana/keys'
  - '@solana/kit'
  - '@solana/kit-plugin-instruction-plan'
  - '@solana/kit-plugin-payer'
  - '@solana/kit-plugin-rpc'
  - '@solana/kora'
  - '@solana/mosaic-sdk'
  - '@solana/nominal-types'
  - '@solana/offchain-messages'
  - '@solana/options'
  - '@solana/plugin-core'
  - '@solana/plugin-interfaces'
  - '@solana/program-client-core'
  - '@solana/programs'
  - '@solana/promises'
  - '@solana/rpc'
  - '@solana/rpc-api'
  - '@solana/rpc-parsed-types'
  - '@solana/rpc-spec'
  - '@solana/rpc-spec-types'
  - '@solana/rpc-subscriptions'
  - '@solana/rpc-subscriptions-api'
  - '@solana/rpc-subscriptions-channel-websocket'
  - '@solana/rpc-subscriptions-spec'
  - '@solana/rpc-transformers'
  - '@solana/rpc-transport-http'
  - '@solana/rpc-types'
  - '@solana/signers'
  - '@solana/subscribable'
  - '@solana/subscriptions'
  - '@solana/surfpool'
  - '@solana/surfpool-darwin-arm64'
  - '@solana/surfpool-darwin-x64'
  - '@solana/surfpool-linux-x64-gnu'
  - '@solana/sysvars'
  - '@solana/token-acl-gate-sdk'
  - '@solana/transaction-confirmation'
  - '@solana/transaction-messages'
  - '@solana/transactions'
  # A 2014 release whose registry metadata carries no "time" field, so the age
  # gate can never clear it. Reached only as a transitive dev dependency of
  # vitest. Excluded rather than relaxing the gate for the whole workspace.
  - 'stackback'
