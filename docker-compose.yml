services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sdp
      POSTGRES_USER: sdp
      POSTGRES_PASSWORD: sdp
    ports:
      - "${SDP_POSTGRES_PORT:-5432}:5432"
    volumes:
      - sdp-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdp -d sdp"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${SDP_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  sdp-migrate:
    build:
      context: .
      dockerfile: apps/sdp-api/Dockerfile
      target: builder
    working_dir: /repo/apps/sdp-api
    command: ["node", "scripts/migrate-postgres.mjs"]
    environment:
      DATABASE_URL: postgresql://sdp:sdp@postgres:5432/sdp
    depends_on:
      postgres:
        condition: service_healthy

  sdp-api:
    build:
      context: .
      dockerfile: apps/sdp-api/Dockerfile
    restart: unless-stopped
    ports:
      - "${SDP_API_PORT:-8787}:8787"
    environment:
      # Core
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ASSET_PROFILES_ENABLED: ${ASSET_PROFILES_ENABLED:-true}
      PRIVATE_CHANNELS_ENABLED: ${PRIVATE_CHANNELS_ENABLED:-false}
      SDP_FLAG_ASSET_PROFILES: ${SDP_FLAG_ASSET_PROFILES:-true}
      PRIVY_BYOK_ENABLED: ${PRIVY_BYOK_ENABLED:-false}
      SELF_HOSTED_STORED_CONNECTION_SETUP_ENABLED: ${SELF_HOSTED_STORED_CONNECTION_SETUP_ENABLED:-false}
      API_VERSION: ${API_VERSION:-local-compose}
      SDP_DEPLOYMENT_MODE: ${SDP_DEPLOYMENT_MODE:-self_hosted}
      DATABASE_URL: postgresql://sdp:sdp@postgres:5432/sdp
      REDIS_URL: redis://redis:6379

      # Clerk authentication
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:-}

      # App secrets
      API_KEY_PEPPER: ${API_KEY_PEPPER:-}
      CREDENTIAL_FINGERPRINT_PEPPER: ${CREDENTIAL_FINGERPRINT_PEPPER:-}
      CUSTODY_ENCRYPTION_KEY: ${CUSTODY_ENCRYPTION_KEY:-}
      SPC_CREDENTIAL_ENCRYPTION_KEY: ${SPC_CREDENTIAL_ENCRYPTION_KEY:-}

      # Solana
      SOLANA_NETWORK: ${SOLANA_NETWORK:-devnet}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.devnet.solana.com}

      # Signing
      SIGNING_PROVIDER: ${SIGNING_PROVIDER:-local}
      PRIVY_APP_ID: ${PRIVY_APP_ID:-}
      PRIVY_APP_SECRET: ${PRIVY_APP_SECRET:-}
      FEE_PAYER_PRIVATE_KEY: ${FEE_PAYER_PRIVATE_KEY:-}
      FEE_PAYMENT_PROVIDER: ${FEE_PAYMENT_PROVIDER:-native}

      # Observability (optional)
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sdp-migrate:
        condition: service_completed_successfully

  sdp-web:
    build:
      context: .
      dockerfile: apps/sdp-web/Dockerfile
      args:
        NEXT_PUBLIC_SDP_API_BASE_URL: ${NEXT_PUBLIC_SDP_API_BASE_URL:-http://localhost:8787}
        NEXT_PUBLIC_SDP_DOCS_URL: ${NEXT_PUBLIC_SDP_DOCS_URL:-http://localhost:3001}
        NEXT_PUBLIC_SOLANA_NETWORK: ${NEXT_PUBLIC_SOLANA_NETWORK:-devnet}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    restart: unless-stopped
    ports:
      - "${SDP_WEB_PORT:-3000}:3000"
    environment:
      PRIVATE_CHANNELS_ENABLED: ${PRIVATE_CHANNELS_ENABLED:-false}
      SDP_API_BASE_URL: http://sdp-api:8787
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      SDP_FLAG_ASSET_PROFILES: ${SDP_FLAG_ASSET_PROFILES:-true}
      SDP_FLAG_HOMEPAGE_OPEN_SIGNUP: ${SDP_FLAG_HOMEPAGE_OPEN_SIGNUP:-}
      SDP_FLAG_ORGANIZATION_ONBOARDING: ${SDP_FLAG_ORGANIZATION_ONBOARDING:-}
    depends_on:
      sdp-api:
        condition: service_healthy

  sdp-docs:
    build:
      context: .
      dockerfile: apps/sdp-docs/Dockerfile
      args:
        NEXT_PUBLIC_SDP_WEB_URL: ${NEXT_PUBLIC_SDP_WEB_URL:-http://localhost:3000}
        NEXT_PUBLIC_SDP_DOCS_URL: ${NEXT_PUBLIC_SDP_DOCS_URL:-http://localhost:3001}
        NEXT_PUBLIC_SDP_API_URL: ${NEXT_PUBLIC_SDP_API_URL:-http://localhost:8787}
    restart: unless-stopped
    ports:
      - "${SDP_DOCS_PORT:-3001}:3001"

  # Opt-in: `docker compose --profile rings up sdp-helius-gateway`.
  #
  # Behind a profile for two reasons. It is a Rust release build of ~450 crates,
  # which would push the docker_compose_smoke job past its 25-minute timeout; and
  # it is useless without a reachable Photon indexer and prover, which the default
  # local stack does not provide.
  sdp-helius-gateway:
    profiles:
      - rings
    build:
      # Context is the crate directory, not the repo root: it is not a pnpm
      # workspace member and has nothing to copy from outside itself.
      context: apps/sdp-helius-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Loopback-only, unlike the other services here. This one ships working
      # default HMAC secrets in this file, so an unrestricted mapping would let
      # anything that can reach the developer's host sign valid requests once the
      # handlers do real work. Local testing is unaffected.
      - "127.0.0.1:${HELIUS_GATEWAY_PORT:-8788}:8788"
    environment:
      HELIUS_GATEWAY_PORT: 8788
      # One secret per caller: the gateway verifies each route against its own
      # caller's secret rather than against either, so the keyless routes and the
      # key-bearing ones cannot be signed interchangeably.
      #
      # Local-only placeholders. Both must be at least 32 bytes, and each must match
      # what that caller signs with. Never reuse these values anywhere real.
      HELIUS_GATEWAY_HMAC_SECRET_SDP_API: ${HELIUS_GATEWAY_HMAC_SECRET_SDP_API:-local-development-only-sdp-api-secret-32b}
      HELIUS_GATEWAY_HMAC_SECRET_KEY_AUTH: ${HELIUS_GATEWAY_HMAC_SECRET_KEY_AUTH:-local-development-only-key-auth-secret-32}
      # Upstream endpoints are env-only. A caller-supplied prover URL alongside a
      # decrypted nullifier key would let one request exfiltrate that key.
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      PHOTON_URL: ${PHOTON_URL:-http://host.docker.internal:8784}
      PROVER_URL: ${PROVER_URL:-http://host.docker.internal:3001}
      RUST_LOG: ${RUST_LOG:-info}

volumes:
  sdp-postgres-data:
