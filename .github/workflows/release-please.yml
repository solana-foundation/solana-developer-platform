name: Release Flow

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  plan:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore(main): release ') }}"
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Plan release
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/release-flow.mjs plan

  prepare-release-pr:
    needs: plan
    if: ${{ needs.plan.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-flow-main
      cancel-in-progress: false
    steps:
      - name: Create release app token
        id: release-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.0.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          token: ${{ steps.release-app.outputs.token }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Prepare release PR
        env:
          GITHUB_TOKEN: ${{ steps.release-app.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/release-flow.mjs prepare

  # Split out of prepare-release-pr on purpose. The release PR is already open
  # and correct by the time this runs, so a translation gap must not paint the
  # push to main red. continue-on-error keeps the workflow green; the outcome is
  # reported on the release PR itself, where it can block the release merge.
  translate-release-strings:
    needs: prepare-release-pr
    runs-on: ubuntu-latest
    continue-on-error: true
    concurrency:
      group: release-flow-main
      cancel-in-progress: false
    steps:
      - name: Create release app token
        id: release-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.0.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          token: ${{ steps.release-app.outputs.token }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Translate missing UI strings
        env:
          GITHUB_TOKEN: ${{ steps.release-app.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TRANSLATION_AGENT_URL: ${{ vars.TRANSLATION_AGENT_URL }}
          TRANSLATION_AGENT_USERNAME: ${{ secrets.TRANSLATION_AGENT_USERNAME }}
          TRANSLATION_AGENT_PASSWORD: ${{ secrets.TRANSLATION_AGENT_PASSWORD }}
          TRANSLATION_AGENT_MODEL: ${{ vars.TRANSLATION_AGENT_MODEL }}
          TRANSLATION_AGENT_BATCH_SIZE: ${{ vars.TRANSLATION_AGENT_BATCH_SIZE }}
          TRANSLATION_AGENT_MAX_RETRIES: ${{ vars.TRANSLATION_AGENT_MAX_RETRIES }}
        run: |
          set -euo pipefail

          if ! git ls-remote --exit-code origin refs/heads/sdp/release-main >/dev/null 2>&1; then
            echo "No release branch was created; skipping translation sync."
            exit 0
          fi

          git reset --hard
          git fetch origin sdp/release-main
          git checkout -B sdp/release-main origin/sdp/release-main
          node .github/scripts/translate-missing.mjs

  publish-release:
    if: "${{ startsWith(github.event.head_commit.message, 'chore(main): release ') }}"
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    concurrency:
      group: release-flow-main
      cancel-in-progress: false
    steps:
      - name: Create release app token
        id: release-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.0.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          token: ${{ steps.release-app.outputs.token }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Publish release tag and GitHub release
        env:
          GITHUB_TOKEN: ${{ steps.release-app.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/release-flow.mjs publish

      - name: Resolve published release
        id: release
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          release_tag="v${version}"
          release_sha="$(git rev-parse "${release_tag}^{commit}")"

          if [[ "${release_sha}" != "${GITHUB_SHA}" ]]; then
            echo "${release_tag} resolves to ${release_sha}, expected ${GITHUB_SHA}." >&2
            exit 1
          fi

          echo "release_sha=${release_sha}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"

  deploy-api-production:
    needs: publish-release
    permissions:
      contents: read
      id-token: write
      packages: read
    uses: ./.github/workflows/deploy-sdp-api-gcp-prod.yml
    secrets:
      DOPPLER_TOKEN_CI: ${{ secrets.DOPPLER_TOKEN_CI }}
    with:
      release_sha: ${{ needs.publish-release.outputs.release_sha }}
      release_tag: ${{ needs.publish-release.outputs.release_tag }}
