# Live gate: payments trust a catalogue mint's decimals and extensions without reading the chain,
# so every catalogue change is checked against devnet and mainnet before it merges.
name: Well-Known Mints

on:
  pull_request:
    paths:
      - "packages/sdp-types/src/well-known-tokens.ts"
      - "scripts/check-well-known-mints.mjs"
      - ".github/workflows/well-known-mints.yml"

permissions:
  contents: read

concurrency:
  group: well-known-mints-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Catalogue matches chain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.16.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check catalogue mints
        run: pnpm check:well-known-mints
