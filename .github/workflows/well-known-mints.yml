# Live gate: payments trust a catalogue mint's decimals and extensions without reading the chain,
# so every catalogue change is checked against devnet and mainnet before it merges.
name: Well-Known Mints

on:
  pull_request:
    paths:
      - 'packages/sdp-types/src/well-known-tokens.ts'
      - 'scripts/check-well-known-mints.mjs'
      - '.github/workflows/well-known-mints.yml'

permissions:
  contents: read

concurrency:
  group: well-known-mints-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Catalogue matches chain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.16.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check catalogue mints
        run: pnpm check:well-known-mints
