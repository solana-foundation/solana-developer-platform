# Correctness gate for apps/sdp-helius-gateway.
#
# This is the crate's ONLY gate. Biome ignores .rs, the ci.yml typecheck job
# resolves the directory and then no-ops via --if-present, and CodeQL has no Rust
# analysis. If this workflow does not run, nothing checks the Rust.
#
# A separate path-filtered workflow rather than a job in ci.yml on purpose: a job
# there would still queue a runner and clone the monorepo on every pull request in
# the repo before deciding it had nothing to do. Native `paths:` means GitHub never
# starts it at all.
#
# The tradeoff, worth knowing before making this a required check: a workflow that
# does not run reports no status. If `Rust Gateway` is ever added to branch
# protection as required, it has to move back into ci.yml and detect changes at
# runtime so that it always reports.
name: Rust Gateway

on:
  pull_request:
    paths:
      - "apps/sdp-helius-gateway/**"
      - ".github/workflows/rust-gateway.yml"
  push:
    branches:
      - main
    paths:
      - "apps/sdp-helius-gateway/**"
      - ".github/workflows/rust-gateway.yml"

permissions:
  contents: read

concurrency:
  group: rust-gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/sdp-helius-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rustup honours apps/sdp-helius-gateway/rust-toolchain.toml, which pins the
      # channel and the clippy/rustfmt components. No third-party action needed.
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # Action inputs are resolved from the workspace root, not the job's
          # working-directory.
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/sdp-helius-gateway/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/sdp-helius-gateway/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      # Cached separately from the build: the cargo cache above covers the registry
      # but not ~/.cargo/bin, so without this the tool is recompiled from source on
      # every run.
      - name: Cache cargo-audit
        id: audit-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.0-${{ runner.os }}

      - name: Install cargo-audit
        if: steps.audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.0 --locked

      # Advisories only cover crates.io packages, so the zolana git dependencies are
      # outside its reach — and they are the novel supply-chain surface here.
      # Bumping their pinned revision stays a deliberate manual act.
      - name: Audit dependencies
        run: cargo audit
