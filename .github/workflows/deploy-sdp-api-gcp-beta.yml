name: Deploy sdp-api to Cloud Run (beta)

# Beta (api-beta.solana.com) is the devnet sandbox. The merge deploy dispatches this as its own run
# once the stage deploy and smoke pass, so a slow or stuck beta never holds prod or the next merge's
# deploy (the merge deploy's concurrency slot) up. It runs in its own GCP project
# with its own registry, services and database, and deploys the signed merge image the prod deploy
# promotes. Every step continues on error and skips while those resources do not exist yet: a
# failure reports to Slack (deploy) or Loki with target=beta (smoke).

on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: "40-character main commit whose signed merge image to deploy"
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  packages: read

concurrency:
  group: sdp-api-gcp-deploy-beta
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy beta
    if: github.repository == 'solana-foundation/solana-developer-platform' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 135
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
      packages: read
      statuses: write
    outputs:
      present: ${{ steps.find.outputs.present == 'true' }}
    env:
      PROJECT_ID: solana-developer-platform-beta
      REGION: us-central1
      REPO: sdp-beta
      BETA_SERVICE: sdp-beta-api-public
      BETA_WORKER_SERVICE: sdp-beta-worker
      BETA_MIGRATE_JOB: sdp-beta-api-public-migrate
      BETA_ORIGIN: https://api-beta.solana.com
      DEPLOY_IMAGE_SHA: ${{ inputs.image_sha }}
    steps:
      - name: Checkout
        continue-on-error: true
        timeout-minutes: 2
        # The run's own ref (main): the scripts this job runs with credentials never come from the
        # image_sha input, which only names the signed image to deploy. Full history orders
        # breaking migrations against the commit beta serves.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Authenticate to GCP
        id: auth
        continue-on-error: true
        timeout-minutes: 2
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.BETA_DEPLOY_WIF_PROVIDER }}
          service_account: ${{ vars.BETA_DEPLOY_SA }}

      - name: Set up gcloud
        id: gcloud
        if: steps.auth.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Find beta resources
        id: find
        if: steps.gcloud.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        run: |
          set -euo pipefail
          if [[ ! "${DEPLOY_IMAGE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "image_sha must be a lowercase 40-character Git SHA." >&2
            exit 1
          fi
          err="$(mktemp)"
          missing=()
          describe() {
            if gcloud run "$@" --region "${REGION}" --project "${PROJECT_ID}" --format='value(metadata.name)' >/dev/null 2>"${err}"; then
              return 0
            elif grep -qiE "NOT_FOUND|could not be found|cannot find" "${err}"; then
              missing+=("$3")
              return 0
            fi
            cat "${err}" >&2
            return 1
          }
          describe jobs describe "${BETA_MIGRATE_JOB}"
          describe services describe "${BETA_SERVICE}"
          describe services describe "${BETA_WORKER_SERVICE}"
          if [[ "${#missing[@]}" -gt 0 ]]; then
            echo "::notice::Beta not created yet (missing: ${missing[*]}); skipping the beta deploy."
            echo "present=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # The rollback in docs/ops/release-operations.md re-pins this digest.
          previous="$(gcloud run services describe "${BETA_SERVICE}" \
            --region "${REGION}" --project "${PROJECT_ID}" \
            --format='value(status.latestReadyRevisionName)')"
          if [[ -n "${previous}" ]]; then
            digest="$(gcloud run revisions describe "${previous}" \
              --region "${REGION}" --project "${PROJECT_ID}" --format='value(status.imageDigest)')"
            echo "Beta served ${previous} (${digest:-digest unknown}) before this deploy." >> "${GITHUB_STEP_SUMMARY}"
          fi
          echo "present=true" >> "${GITHUB_OUTPUT}"

      - name: Configure Docker for Artifact Registry
        id: docker
        if: steps.find.outputs.present == 'true'
        continue-on-error: true
        timeout-minutes: 2
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Install Cosign
        id: cosign
        if: steps.docker.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install crane
        id: crane
        if: steps.cosign.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      - name: Log in to GHCR
        id: ghcr
        if: steps.crane.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --password-stdin keeps the token off the command line.
        run: printf '%s' "$GHCR_TOKEN" | crane auth login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Same shape as the prod deploy: beta cannot read stage's registry, so it verifies the merge
      # image release-images.yml signed for this commit and copies that same digest into its own
      # registry. The wait covers release-images.yml's 60-minute publish timeout.
      - name: Verify and promote merge image
        id: promote
        if: steps.ghcr.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 75
        run: |
          set -euo pipefail
          SRC_BASE="ghcr.io/${{ github.repository_owner }}/sdp/sdp-api"
          SRC_DIGEST=""
          for attempt in $(seq 1 130); do
            if SRC_DIGEST="$(crane digest "${SRC_BASE}:${DEPLOY_IMAGE_SHA}" 2>/dev/null)"; then
              break
            fi
            echo "merge image not in GHCR yet (attempt ${attempt}/130); retrying in 30s"
            sleep 30
          done
          if [[ -z "${SRC_DIGEST}" ]]; then
            echo "merge image ${SRC_BASE}:${DEPLOY_IMAGE_SHA} never appeared in GHCR." >&2
            exit 1
          fi
          verified=""
          for attempt in $(seq 1 10); do
            if cosign verify "${SRC_BASE}@${SRC_DIGEST}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release-images.yml@refs/heads/main" \
              --certificate-github-workflow-sha "${DEPLOY_IMAGE_SHA}"; then
              verified=true
              break
            fi
            echo "signature not verifiable yet (attempt ${attempt}/10); retrying in 30s"
            sleep 30
          done
          if [[ -z "${verified}" ]]; then
            echo "cosign verification failed for ${SRC_BASE}@${SRC_DIGEST}." >&2
            exit 1
          fi
          DEST_BASE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/sdp-api-public"
          cosign copy --force "${SRC_BASE}@${SRC_DIGEST}" "${DEST_BASE}:${DEPLOY_IMAGE_SHA}"
          echo "src_digest=${SRC_DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Resolve immutable deploy image
        id: image
        if: steps.promote.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        env:
          SRC_DIGEST: ${{ steps.promote.outputs.src_digest }}
        run: |
          set -euo pipefail
          image_base="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/sdp-api-public"
          tagged_image="${image_base}:${DEPLOY_IMAGE_SHA}"
          resolved_image="$(
            gcloud artifacts docker images describe "${tagged_image}" \
              --project "${PROJECT_ID}" \
              --format='value(image_summary.fully_qualified_digest)'
          )"
          expected_prefix="${image_base}@"
          if [[ "${resolved_image}" != "${expected_prefix}"* ]]; then
            echo "Artifact Registry returned an unexpected image reference for ${tagged_image}." >&2
            exit 1
          fi
          digest="${resolved_image:${#expected_prefix}}"
          if [[ "${digest}" != "${SRC_DIGEST}" ]]; then
            echo "Artifact Registry digest ${digest} does not match the verified merge digest ${SRC_DIGEST}." >&2
            exit 1
          fi
          echo "image=${resolved_image}" >> "${GITHUB_OUTPUT}"
          echo "Deploying ${tagged_image} as ${resolved_image}" >> "${GITHUB_STEP_SUMMARY}"

      # A breaking migration drops what the serving image may still read, and it runs before
      # the new revision takes traffic. Beta can skip merges (a failed or queued run), so apply
      # one only while beta serves the commit before its last edit, as prod does.
      - name: Refuse a breaking migration until beta serves its parent
        id: breaking
        if: steps.image.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set -euo pipefail
          if ! git cat-file -e "${DEPLOY_IMAGE_SHA}^{commit}" 2>/dev/null; then
            echo "${DEPLOY_IMAGE_SHA} is not in main's history." >&2
            exit 1
          fi
          service_json="$(
            gcloud run services describe "${BETA_SERVICE}" \
              --region "${REGION}" --project "${PROJECT_ID}" --format=json
          )"
          serving_revision="$(
            jq -er '
              [.status.traffic[] | select((.percent // 0) > 0)]
              | if length != 1 then error("beta traffic is not on exactly one revision")
                elif (.[0].revisionName // "") == "" then error("the serving traffic target has no resolved revisionName")
                else .[0].revisionName end
            ' <<<"${service_json}"
          )"
          serving_image="$(
            gcloud run revisions describe "${serving_revision}" \
              --region "${REGION}" --project "${PROJECT_ID}" --format='value(status.imageDigest)'
          )"
          if [[ "${serving_image}" != "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/sdp-api-public@"* ]]; then
            echo "Beta serves ${serving_image:-no image} from outside ${REPO}, so no SDP build reads its schema yet."
            exit 0
          fi
          # The image records the commit it was built from, so a broken beta (failing readiness)
          # can still be repaired: nothing here depends on the serving API answering.
          serving="$(
            crane config "${serving_image}" |
              jq -r '.config.Env[]? | select(startswith("SDP_BUILD_SHA=")) | ltrimstr("SDP_BUILD_SHA=")' |
              head -n 1 | tr -d '[:space:]'
          )" || serving=""
          if [[ ! "${serving}" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "${serving}^{commit}" 2>/dev/null; then
            echo "Could not read the commit ${serving_revision} was built from (${serving_image}), so migrations cannot be ordered against it." >&2
            exit 1
          fi
          changed="$(git diff --name-only --no-renames --diff-filter=AM "${serving}" "${DEPLOY_IMAGE_SHA}" -- apps/sdp-api/src/db/migrations/postgres)"
          for file in ${changed}; do
            sql="$(git show "${DEPLOY_IMAGE_SHA}:${file}")"
            if ! grep -Eq '^--[[:space:]]*sdp:migration-compat:[[:space:]]*breaking[[:space:]]*$' <<<"${sql}"; then
              continue
            fi
            edited="$(git log --format=%H -n 1 "${serving}..${DEPLOY_IMAGE_SHA}" -- "${file}")"
            if [[ -z "${edited}" ]] || ! git merge-base --is-ancestor "${edited}^" "${serving}"; then
              echo "${file} is marked breaking, so it runs only once beta serves ${edited:-its last edit}^, the commit before its last pending edit. Beta serves ${serving}; deploy that parent first." >&2
              exit 1
            fi
            echo "Applying breaking migration ${file}; beta serves ${serving}." >> "${GITHUB_STEP_SUMMARY}"
          done

      - name: Run beta database migrations
        id: migrate
        if: steps.breaking.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          gcloud run jobs update "${BETA_MIGRATE_JOB}" \
            --region "${REGION}" --project "${PROJECT_ID}" --image "${IMAGE}"
          gcloud run jobs execute "${BETA_MIGRATE_JOB}" \
            --region "${REGION}" --project "${PROJECT_ID}" --wait

      - name: Deploy beta service
        id: service
        if: steps.migrate.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          gcloud run services update "${BETA_SERVICE}" \
            --region "${REGION}" --project "${PROJECT_ID}" --image "${IMAGE}"

      - name: Verify beta revision readiness
        id: ready
        if: steps.service.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set -euo pipefail
          REVISION=$(gcloud run services describe "${BETA_SERVICE}" \
            --region "${REGION}" --project "${PROJECT_ID}" \
            --format='value(status.latestCreatedRevisionName)')
          echo "candidate revision: ${REVISION}"
          for attempt in $(seq 1 12); do
            READY=$(gcloud run revisions describe "${REVISION}" \
              --region "${REGION}" --project "${PROJECT_ID}" --format=json \
              | jq -r '.status.conditions[] | select(.type == "Ready") | .status')
            if [ "${READY}" = "True" ]; then
              echo "revision ${REVISION} is ready"
              echo "revision=${REVISION}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "attempt ${attempt}/12: revision ${REVISION} not ready yet (${READY:-unknown})"
            sleep 10
          done
          echo "revision ${REVISION} never became ready" >&2
          exit 1

      - name: Check the beta release channel
        id: channel
        if: steps.ready.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        run: |
          set -euo pipefail
          channel=""
          for attempt in 1 2 3; do
            if channel="$(curl --fail --silent --show-error --max-time 10 "${BETA_ORIGIN}/health" | jq -er '.releaseChannel')"; then
              break
            fi
            sleep $((attempt * 10))
          done
          echo "${BETA_ORIGIN}/health reports releaseChannel=${channel:-unreadable}"
          [[ "${channel}" == "beta" ]]

      - name: Update beta worker image
        id: worker
        if: steps.channel.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          gcloud run services update "${BETA_WORKER_SERVICE}" \
            --region "${REGION}" --project "${PROJECT_ID}" --image "${IMAGE}"

      # Same shape as release-web in deploy-sdp-api-gcp-prod.yml: posts only while beta still
      # serves the revision this run deployed.
      - name: Post the sdp-web beta gate status
        id: gate
        if: steps.worker.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_SHA: ${{ inputs.image_sha }}
          DEPLOYED_REVISION: ${{ steps.ready.outputs.revision }}
        run: |
          set -euo pipefail
          serving=""
          for attempt in 1 2 3; do
            if serving="$(curl --fail --silent --show-error --max-time 10 "${BETA_ORIGIN}/health/ready" | jq -er '.revision')"; then
              break
            fi
            sleep $((attempt * 10))
          done
          if [[ -z "${serving}" ]]; then
            echo "Could not read the serving beta revision; beta web stays held for ${IMAGE_SHA}." >&2
            exit 1
          fi
          if [[ "${serving}" != "${DEPLOYED_REVISION}" ]]; then
            echo "Beta now serves ${serving}, not ${DEPLOYED_REVISION} from ${IMAGE_SHA}; leaving its web held." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          for attempt in 1 2 3; do
            if gh api "repos/${GITHUB_REPOSITORY}/statuses/${IMAGE_SHA}" \
              -f state=success -f context="sdp-web beta gate" -f description="Beta API serves this commit"; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "Could not post the sdp-web beta gate for ${IMAGE_SHA}." >&2
          exit 1

      - name: Install Doppler CLI
        if: >-
          steps.auth.outcome == 'failure' || steps.gcloud.outcome == 'failure' ||
          steps.find.outcome == 'failure' || steps.docker.outcome == 'failure' ||
          steps.cosign.outcome == 'failure' || steps.crane.outcome == 'failure' ||
          steps.ghcr.outcome == 'failure' || steps.promote.outcome == 'failure' ||
          steps.image.outcome == 'failure' || steps.breaking.outcome == 'failure' ||
          steps.migrate.outcome == 'failure' ||
          steps.service.outcome == 'failure' || steps.ready.outcome == 'failure' ||
          steps.channel.outcome == 'failure' || steps.worker.outcome == 'failure' ||
          steps.gate.outcome == 'failure'
        id: doppler
        continue-on-error: true
        timeout-minutes: 2
        uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4.0.1

      - name: Doppler OIDC login
        id: doppler_login
        if: steps.doppler.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        run: scripts/doppler/oidc-login.sh "${{ vars.DOPPLER_CI_IDENTITY_ID }}"

      - name: Notify Slack — beta deploy failed
        if: steps.doppler_login.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        env:
          DOPPLER_PROJECT: solana-developer-platform
          DOPPLER_CONFIG: dev_ci
          SERVICE: sdp-api
          ENV: beta
          STATUS: failure
          VERSION: ${{ inputs.image_sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          COMMIT="$(git log -1 --format='%h — %s' "${VERSION}" 2>/dev/null | cut -c1-140 || true)"
          export COMMIT
          ./scripts/notify-slack.sh

  smoke:
    name: Beta API smoke
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    if: needs.deploy.outputs.present == 'true'
    env:
      SMOKE_TARGET: beta
      BETA_ORIGIN: https://api-beta.solana.com
    steps:
      - name: Checkout
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Probe the beta API
        id: smoke
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set -euo pipefail
          HEALTH=$(curl -sS -m 15 "${BETA_ORIGIN}/health")
          echo "$HEALTH"
          echo "$HEALTH" | jq -e '.releaseChannel == "beta"' >/dev/null
          READY=$(curl -sS -m 15 "${BETA_ORIGIN}/health/ready")
          echo "$READY"
          echo "$READY" | jq -e '.status == "ready" and .checks.database == "ok" and .checks.redis == "ok"' >/dev/null

      - name: Install Doppler CLI
        id: doppler
        continue-on-error: true
        timeout-minutes: 2
        uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4.0.1

      - name: Doppler OIDC login
        id: doppler_login
        if: steps.doppler.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        run: scripts/doppler/oidc-login.sh "${{ vars.DOPPLER_STAGE_SMOKE_IDENTITY_ID }}"

      - name: Report beta run to Loki
        if: steps.doppler_login.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        env:
          DOPPLER_PROJECT: solana-developer-platform
          DOPPLER_CONFIG: stg_ci
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: doppler run --scope=. --project "$DOPPLER_PROJECT" --config "$DOPPLER_CONFIG" --preserve-env=SMOKE_OUTCOME,SMOKE_TARGET,RUN_ID,RUN_URL -- ./scripts/report-smoke-to-loki.sh
