name: Apply pending migrations to prod
run-name: "Apply pending migrations to prod — ${{ inputs.image_sha }}"

on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: "Merge commit on main to deploy to prod together with its pending migrations"
        type: string
        required: true

permissions:
  actions: read
  contents: read
  id-token: write
  packages: read

jobs:
  pending:
    name: List pending migrations
    if: >-
      github.repository == 'solana-foundation/solana-developer-platform' &&
      github.ref == 'refs/heads/main' &&
      vars.CONTINUOUS_PROD_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Validate the commit
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${IMAGE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "image_sha must be a lowercase 40-character Git SHA." >&2
            exit 1
          fi
          echo "IMAGE_SHA=${IMAGE_SHA}" >> "${GITHUB_ENV}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Require a commit on main
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "${IMAGE_SHA}" origin/main; then
            echo "${IMAGE_SHA} is not on main." >&2
            exit 1
          fi

      - name: Require a green stage deploy for the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?head_sha=${IMAGE_SHA}&event=push&per_page=10" \
            --jq '[.workflow_runs[] | select(.status == "completed")] | sort_by(.run_number) | last | .id // empty')"
          if [[ -z "${run_id}" ]]; then
            echo "No completed SDP Deploy run found for ${IMAGE_SHA}; stage has not deployed it." >&2
            exit 1
          fi
          stage_green="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name | startswith("sdp-api + worker + cron — stage + smoke"))] | length > 0 and all(.conclusion == "success")')"
          if [[ "${stage_green}" != "true" ]]; then
            echo "Stage deploy or smoke did not succeed for ${IMAGE_SHA} (SDP Deploy run ${run_id}); fix stage before approving prod." >&2
            exit 1
          fi

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.DEPLOY_WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Show what approval would apply
        run: |
          set -euo pipefail
          applied="$(gcloud run jobs describe sdp-prod-api-public-migrate \
            --region us-central1 --project solana-developer-platform \
            --format 'value(metadata.labels.sdp_schema_sha)')"
          if [[ "${applied}" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${applied}^{commit}" 2>/dev/null; then
            if ! git merge-base --is-ancestor "${applied}" "${IMAGE_SHA}"; then
              echo "Prod already applied ${applied}, which ${IMAGE_SHA} does not include. Approve the newest held run instead." >&2
              exit 1
            fi
            pending="$(git diff --name-only "${applied}..${IMAGE_SHA}" -- apps/sdp-api/src/db/migrations/postgres)"
            commits="$(git log --oneline "${applied}..${IMAGE_SHA}")"
          else
            pending="prod schema position unknown (sdp_schema_sha=${applied:-unset}); approval seeds it"
            commits="$(git log --oneline -1 "${IMAGE_SHA}")"
          fi
          {
            printf 'Approving deploys %s to prod and runs these migrations:\n\n%s\n\nCommits since the schema prod last applied:\n\n%s\n' \
              "${IMAGE_SHA}" "${pending:-none}" "${commits}"
          } >> "${GITHUB_STEP_SUMMARY}"

  approve:
    name: Schema approval
    needs: pending
    if: vars.CONTINUOUS_PROD_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: release-production
    concurrency:
      group: sdp-prod-schema-approval
      cancel-in-progress: true
    steps:
      - name: Record the approved commit
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
        run: echo "Approved prod deploy with migrations for ${IMAGE_SHA}" >> "${GITHUB_STEP_SUMMARY}"

  deploy:
    name: sdp-api + worker + cron — prod
    needs: approve
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
    uses: ./.github/workflows/deploy-sdp-api-gcp-prod.yml
    with:
      image_sha: ${{ inputs.image_sha }}
      approved_schema: true
