name: Vendor Asset Drift

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: vendor-asset-drift
  cancel-in-progress: false

jobs:
  drift:
    name: Pinned assets match upstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'solana-foundation/solana-developer-platform'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare each pinned asset against upstream
        id: check
        run: |
          set -euo pipefail
          assets="$(jq -r '.[] | [.name, .url, .sha256] | @tsv' .github/vendor-assets.json)"
          if [[ -z "${assets}" ]]; then
            echo "vendor-assets.json is empty or unreadable" >&2
            exit 1
          fi
          drifted=()
          while IFS=$'\t' read -r name url sha; do
            actual="$(curl -fsSL --max-time 60 --retry 2 "${url}" | sha256sum | cut -d' ' -f1)" || actual="fetch-failed"
            if [[ "${actual}" != "${sha}" ]]; then
              drifted+=("${name}: pinned ${sha:0:12}…, upstream ${actual:0:12}…")
            fi
          done <<< "${assets}"

          if [[ "${#drifted[@]}" -gt 0 ]]; then
            printf '%s\n' "${drifted[@]}" | tee -a "${GITHUB_STEP_SUMMARY}"
            {
              echo "drifted<<EOF"
              printf '%s\n' "${drifted[@]}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
            exit 1
          fi
          echo "All pinned vendor assets match upstream." >> "${GITHUB_STEP_SUMMARY}"

      - name: Install Doppler CLI
        if: failure()
        uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4.0.1

      - name: Doppler OIDC login
        if: failure()
        run: |
          oidc_jwt=$(curl -sf -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://github.com/solana-foundation" | jq -r '.value')
          doppler oidc login --scope=. --identity="${{ vars.DOPPLER_CI_IDENTITY_ID }}" --token="${oidc_jwt}"

      - name: Notify Slack on drift
        if: failure()
        continue-on-error: true
        env:
          DRIFTED: ${{ steps.check.outputs.drifted }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          SLACK=$(doppler secrets get SLACK_ALERT_WEBHOOK_URL --plain --scope=. --project solana-developer-platform --config dev_ci 2>/dev/null || true)
          if [ -z "$SLACK" ]; then echo "::warning::SLACK_ALERT_WEBHOOK_URL missing — skipping notification"; exit 0; fi
          echo "::add-mask::$SLACK"
          PAYLOAD=$(jq -n --arg drifted "$DRIFTED" --arg run "$RUN_URL" \
            '{ text: "*[FIRING] vendor-asset-drift [sdp-web]*",
               attachments: [ { color: "#cc0000", blocks: [
                 {type: "section", text: {type: "mrkdwn", text: "*A pinned vendor asset no longer matches upstream.*\nThe web app refuses to serve the drifted asset until the pin is reviewed and bumped.\n```\($drifted)```\n<\($run)|drift run>"}} ] } ] }')
          curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' --data "$PAYLOAD" "$SLACK"
