name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "34 2 * * 1" # Monday 02:34 UTC (to avoid GH load spikes at :00)

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Timing codeql init start
        run: node scripts/ci/timing/mark.mjs "codeql:${{ matrix.language }}:init:start"
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Timing codeql init end
        if: always()
        run: node scripts/ci/timing/mark.mjs "codeql:${{ matrix.language }}:init:end"
      - name: Timing codeql analyze start
        run: node scripts/ci/timing/mark.mjs "codeql:${{ matrix.language }}:analyze:start"
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ matrix.language }}"
      - name: Timing codeql analyze end
        if: always()
        run: node scripts/ci/timing/mark.mjs "codeql:${{ matrix.language }}:analyze:end"
      - name: Timing report
        if: always()
        run: node scripts/ci/timing/report.mjs
