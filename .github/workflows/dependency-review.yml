name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Kamino dependency boundary
        run: node scripts/ci/timing/timed.mjs "check:kamino-dependency-boundary" -- node scripts/check-kamino-dependency-boundary.mjs
      # `@sdp/veda` must remain the ONLY owner of @vedatech/svm-sdk: the SDK is
      # a kit-7 chain client in a kit-6.8 workspace, and a second owner would
      # spread that nested major past the one sanctioned import site.
      - name: Check Veda dependency boundary
        run: node scripts/ci/timing/timed.mjs "check:veda-dependency-boundary" -- node scripts/check-veda-dependency-boundary.mjs
      - name: Timing dependency review start
        run: node scripts/ci/timing/mark.mjs "dependency-review:start"
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
      - name: Timing dependency review end
        if: always()
        run: node scripts/ci/timing/mark.mjs "dependency-review:end"
      - name: Timing report
        if: always()
        run: node scripts/ci/timing/report.mjs
