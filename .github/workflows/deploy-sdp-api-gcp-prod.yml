name: Deploy sdp-api to Cloud Run (prod)

on:
  workflow_call:
    inputs:
      release_sha:
        description: "Exact release commit to build and deploy"
        type: string
        required: true
      release_tag:
        description: "Version tag that must resolve to release_sha"
        type: string
        required: true
    secrets:
      DOPPLER_TOKEN_CI:
        required: true
  workflow_dispatch:
    inputs:
      image_sha:
        description: "Existing 40-character Git SHA image tag to redeploy (run from main)"
        type: string
        required: true

permissions:
  contents: read
  id-token: write
  packages: read

concurrency:
  group: sdp-api-gcp-deploy-prod
  cancel-in-progress: false

jobs:
  notify-start:
    name: Notify Slack — release started
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    if: github.repository == 'solana-foundation/solana-developer-platform'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4.0.1

      - name: Notify Slack — deploy started
        env:
          GH_TOKEN: ${{ github.token }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_CI }}
          DOPPLER_PROJECT: solana-developer-platform
          DOPPLER_CONFIG: dev_ci
          SERVICE: sdp-api
          ENV: production
          STATUS: started
          VERSION: ${{ inputs.release_tag != '' && inputs.release_tag || inputs.image_sha }}
          DEPLOY_SHA: ${{ inputs.release_sha != '' && inputs.release_sha || inputs.image_sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          COMMIT="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${DEPLOY_SHA}" \
            --jq '(.sha[0:7]) + " — " + (.commit.message | split("\n")[0])' 2>/dev/null || true)"
          export COMMIT
          ./scripts/notify-slack.sh

  smoke:
    name: Gate on dev smoke
    if: >-
      github.repository == 'solana-foundation/solana-developer-platform' &&
      github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/sdp-dev-smoke.yml
    secrets:
      DOPPLER_TOKEN_CI: ${{ secrets.DOPPLER_TOKEN_CI }}
    permissions:
      contents: read

  deploy:
    name: Deploy production image
    needs: smoke
    if: >-
      always() &&
      (needs.smoke.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && needs.smoke.result == 'skipped')) &&
      github.repository == 'solana-foundation/solana-developer-platform' &&
      github.ref == 'refs/heads/main' &&
      ((inputs.release_sha != '' && inputs.release_tag != '') ||
       (github.event_name == 'workflow_dispatch' && inputs.image_sha != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: production
    env:
      PROJECT_ID: solana-developer-platform
      REGION: us-central1
      REPO: sdp-prod
      SERVICE: sdp-prod-api-public
      JOB: sdp-prod-api-public-cron
      WORKER_SERVICE: sdp-prod-worker
      MIGRATE_JOB: sdp-prod-api-public-migrate
    steps:
      - name: Validate deploy image SHA
        env:
          DEPLOY_IMAGE_SHA: ${{ inputs.release_sha != '' && inputs.release_sha || inputs.image_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${DEPLOY_IMAGE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "image_sha must be a lowercase 40-character Git SHA." >&2
            exit 1
          fi
          echo "DEPLOY_IMAGE_SHA=${DEPLOY_IMAGE_SHA}" >> "${GITHUB_ENV}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_sha != '' && inputs.release_sha || github.sha }}

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4.0.1

      - name: Resolve commit summary
        run: echo "COMMIT_LINE=$(git log -1 --format='%h — %s' "${DEPLOY_IMAGE_SHA}" 2>/dev/null || true)" >> "${GITHUB_ENV}"

      - name: Verify release identity
        if: ${{ inputs.release_sha != '' }}
        run: .github/scripts/verify-release-identity.sh "${{ inputs.release_tag }}" "${{ inputs.release_sha }}"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.DEPLOY_WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install crane
        uses: imjasonh/setup-crane@31b88efe9de28ae0ffa220711af4b60be9435f6e # v0.4

      - name: Log in to GHCR
        if: ${{ inputs.release_sha != '' }}
        run: crane auth login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      # The release image was scanned, built with SLSA provenance + SBOM
      # attestations, and keyless-signed by release-images.yml. Verify that
      # signature against the exact release commit and promote the SAME digest
      # to Artifact Registry (cosign copy carries signatures and attestations),
      # so prod runs the artifact that was scanned and signed — never a rebuild.
      - name: Verify and promote release image
        if: ${{ inputs.release_sha != '' }}
        timeout-minutes: 75
        run: |
          set -euo pipefail
          SRC_BASE="ghcr.io/${{ github.repository_owner }}/sdp/sdp-api"
          # release-images.yml is triggered by the tag push and runs in
          # parallel with this deploy: wait out the build-and-sign window
          # before treating a missing tag or signature as a failure.
          SRC_DIGEST=""
          for attempt in $(seq 1 130); do
            if SRC_DIGEST="$(crane digest "${SRC_BASE}:${{ inputs.release_tag }}" 2>/dev/null)"; then
              break
            fi
            echo "release image tag not in GHCR yet (attempt ${attempt}/130); retrying in 30s"
            sleep 30
          done
          if [[ -z "${SRC_DIGEST}" ]]; then
            echo "release image ${SRC_BASE}:${{ inputs.release_tag }} never appeared in GHCR." >&2
            exit 1
          fi
          verified=""
          for attempt in $(seq 1 10); do
            if cosign verify "${SRC_BASE}@${SRC_DIGEST}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release-images.yml@refs/tags/${{ inputs.release_tag }}" \
              --certificate-github-workflow-sha "${DEPLOY_IMAGE_SHA}"; then
              verified=true
              break
            fi
            echo "signature not verifiable yet (attempt ${attempt}/10); retrying in 30s"
            sleep 30
          done
          if [[ -z "${verified}" ]]; then
            echo "cosign verification failed for ${SRC_BASE}@${SRC_DIGEST}." >&2
            exit 1
          fi
          VERSION="$(node -p "require('./package.json').version")"
          DEST_BASE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/sdp-api-public"
          cosign copy --force "${SRC_BASE}@${SRC_DIGEST}" "${DEST_BASE}:${DEPLOY_IMAGE_SHA}"
          crane tag "${DEST_BASE}@${SRC_DIGEST}" "${VERSION}"
          echo "SRC_DIGEST=${SRC_DIGEST}" >> "${GITHUB_ENV}"

      - name: Resolve immutable deploy image
        run: |
          set -euo pipefail
          image_base="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/sdp-api-public"
          tagged_image="${image_base}:${DEPLOY_IMAGE_SHA}"
          resolved_image="$(
            gcloud artifacts docker images describe "${tagged_image}" \
              --project "${PROJECT_ID}" \
              --format='value(image_summary.fully_qualified_digest)'
          )"
          expected_prefix="${image_base}@"
          if [[ "${resolved_image}" != "${expected_prefix}"* ]]; then
            echo "Artifact Registry returned an unexpected image reference for ${tagged_image}." >&2
            exit 1
          fi
          digest="${resolved_image:${#expected_prefix}}"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Artifact Registry returned an invalid digest for ${tagged_image}." >&2
            exit 1
          fi
          if [[ -n "${SRC_DIGEST:-}" && "${digest}" != "${SRC_DIGEST}" ]]; then
            echo "Artifact Registry digest ${digest} does not match the verified release digest ${SRC_DIGEST}." >&2
            exit 1
          fi
          echo "IMAGE=${resolved_image}" >> "${GITHUB_ENV}"
          echo "Deploying ${tagged_image} as ${resolved_image}" >> "${GITHUB_STEP_SUMMARY}"

      # Rollback path (workflow_dispatch by git sha): the AR image must carry
      # the signature copied at its original promotion. An image that predates
      # signed promotion fails here by design; break-glass is documented in the
      # HOO-991 design note.
      - name: Verify rollback image signature
        if: ${{ inputs.release_sha == '' }}
        run: |
          set -euo pipefail
          cosign verify "${IMAGE}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/\.github/workflows/release-images\.yml@refs/tags/v.+$" \
            --certificate-github-workflow-sha "${DEPLOY_IMAGE_SHA}"

      - name: Run database migrations
        if: ${{ inputs.release_sha != '' }}
        timeout-minutes: 15
        run: |
          gcloud run jobs update "${MIGRATE_JOB}" \
            --region "${REGION}" --project "${PROJECT_ID}" --image "${IMAGE}"
          gcloud run jobs execute "${MIGRATE_JOB}" \
            --region "${REGION}" --project "${PROJECT_ID}" --wait

      - name: Capture rollback state
        run: |
          set -euo pipefail
          service_json="$(
            gcloud run services describe "${SERVICE}" \
              --region "${REGION}" --project "${PROJECT_ID}" --format=json
          )"
          previous_traffic="$(
            jq -er '
              [.status.traffic[]
                | select((.percent // 0) > 0)
                | if (.revisionName // "") != "" then
                    "\(.revisionName)=\(.percent)"
                  else error("active traffic target has no resolved revisionName") end]
              | if length > 0 then join(",") else error("service has no active traffic targets") end
            ' <<<"${service_json}"
          )"
          previous_cron_image="$(
            gcloud run jobs describe "${JOB}" \
              --region "${REGION}" --project "${PROJECT_ID}" \
              --format='value(spec.template.spec.template.spec.containers[0].image)'
          )"
          if [[ -z "${previous_cron_image}" ]]; then
            echo "Could not resolve the current cron job image." >&2
            exit 1
          fi
          echo "PREVIOUS_TRAFFIC=${previous_traffic}" >> "${GITHUB_ENV}"
          echo "PREVIOUS_CRON_IMAGE=${previous_cron_image}" >> "${GITHUB_ENV}"
          worker_describe_err="$(mktemp)"
          previous_worker_image="$(
            gcloud run services describe "${WORKER_SERVICE}" \
              --region "${REGION}" --project "${PROJECT_ID}" \
              --format='value(spec.template.spec.containers[0].image)' 2>"${worker_describe_err}"
          )" || {
            if grep -qiE "NOT_FOUND|could not be found" "${worker_describe_err}"; then
              previous_worker_image=""
            else
              cat "${worker_describe_err}" >&2
              exit 1
            fi
          }
          echo "PREVIOUS_WORKER_IMAGE=${previous_worker_image}" >> "${GITHUB_ENV}"

      - name: Deploy candidate without production traffic
        timeout-minutes: 5
        run: |
          set -euo pipefail
          candidate_tag="candidate-${DEPLOY_IMAGE_SHA:0:12}"
          echo "CANDIDATE_TAG=${candidate_tag}" >> "${GITHUB_ENV}"
          echo "ROLLOUT_STARTED=true" >> "${GITHUB_ENV}"
          gcloud run services update "${SERVICE}" \
            --region "${REGION}" --project "${PROJECT_ID}" --image "${IMAGE}" \
            --no-traffic --tag "${candidate_tag}"

          service_json="$(
            gcloud run services describe "${SERVICE}" \
              --region "${REGION}" --project "${PROJECT_ID}" --format=json
          )"
          candidate_revision="$(
            jq -er --arg tag "${candidate_tag}" '
              [.status.traffic[] | select(.tag == $tag)][0].revisionName
                // error("candidate traffic tag is missing a revision")
            ' <<<"${service_json}"
          )"
          revision_digest="$(
            gcloud run revisions describe "${candidate_revision}" \
              --region "${REGION}" --project "${PROJECT_ID}" \
              --format='value(status.imageDigest)'
          )"
          expected_digest="${IMAGE##*@}"
          if [[ "${revision_digest##*@}" != "${expected_digest}" ]]; then
            echo "Candidate ${candidate_revision} resolved to ${revision_digest}, expected ${expected_digest}." >&2
            exit 1
          fi
          echo "CANDIDATE_REVISION=${candidate_revision}" >> "${GITHUB_ENV}"
          echo "Candidate revision: ${candidate_revision}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify candidate revision readiness
        timeout-minutes: 5
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            revision_json="$(
              gcloud run revisions describe "${CANDIDATE_REVISION}" \
                --region "${REGION}" --project "${PROJECT_ID}" --format=json
            )"
            if jq -e '
              [.status.conditions[]
                | select(.type == "Ready" and .status == "True")]
              | length == 1
            ' <<<"${revision_json}" >/dev/null; then
              echo "Candidate ${CANDIDATE_REVISION} is ready to serve traffic."
              exit 0
            fi
            if [[ "${attempt}" -eq 12 ]]; then
              echo "Candidate revision did not become ready after ${attempt} attempts." >&2
              false
            fi
            sleep 10
          done

      - name: Promote service and cron with rollback
        timeout-minutes: 10
        run: |
          set -euo pipefail

          node .github/scripts/verify-managed-reconciliation-cadence.mjs \
            "${JOB}" "${REGION}" "${PROJECT_ID}"

          gcloud run services update-traffic "${SERVICE}" \
            --region "${REGION}" --project "${PROJECT_ID}" \
            --to-revisions "${CANDIDATE_REVISION}=100"

          for attempt in {1..12}; do
            if response="$(
              curl --fail --silent --show-error --max-time 10 \
                "https://api.solana.com/health/ready"
            )" && jq -e --arg revision "${CANDIDATE_REVISION}" '
              .status == "ready"
              and .revision == $revision
              and .checks.database == "ok"
              and .checks.redis == "ok"
            ' <<<"${response}" >/dev/null; then
              break
            fi
            if [[ "${attempt}" -eq 12 ]]; then
              echo "Canonical production traffic did not reach ${CANDIDATE_REVISION}." >&2
              false
            fi
            sleep 10
          done

          gcloud run jobs update "${JOB}" \
            --region "${REGION}" --project "${PROJECT_ID}" --image "${IMAGE}"

          describe_err="$(mktemp)"
          if gcloud run services describe "${WORKER_SERVICE}" \
            --region "${REGION}" --project "${PROJECT_ID}" >/dev/null 2>"${describe_err}"; then
            gcloud run services update "${WORKER_SERVICE}" \
              --region "${REGION}" --project "${PROJECT_ID}" --image "${IMAGE}"
          elif grep -qiE "NOT_FOUND|could not be found" "${describe_err}"; then
            echo "worker service ${WORKER_SERVICE} not created yet; skipping image update"
          else
            cat "${describe_err}" >&2
            exit 1
          fi
          echo "ROLLOUT_COMPLETE=true" >> "${GITHUB_ENV}"

      - name: Record managed monitor migration gate
        if: ${{ env.ROLLOUT_COMPLETE == 'true' }}
        run: |
          {
            echo "### Managed reconciliation monitor follow-up"
            echo
            echo "Do not close SDP-API-5/H/J/P/X yet. Observe two successful managed cadences, then retire the superseded monitors using:"
            echo
            echo 'docs/ops/managed-reconciliation-monitor-migration.md'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Run prod canary against the promoted revision
        if: ${{ env.ROLLOUT_COMPLETE == 'true' }}
        timeout-minutes: 5
        run: |
          gcloud run jobs execute sdp-prod-canary \
            --region "${REGION}" --project "${PROJECT_ID}" --wait

      - name: Roll back incomplete rollout
        if: ${{ always() }}
        timeout-minutes: 5
        run: |
          set -uo pipefail
          if [[ "${ROLLOUT_STARTED:-}" != "true" || "${ROLLOUT_COMPLETE:-}" == "true" ]]; then
            exit 0
          fi

          echo "Rollout did not complete; restoring service traffic and cron image." >&2
          rollback_failed=0
          gcloud run services update-traffic "${SERVICE}" \
            --region "${REGION}" --project "${PROJECT_ID}" \
            --to-revisions "${PREVIOUS_TRAFFIC}" || rollback_failed=1
          gcloud run jobs update "${JOB}" \
            --region "${REGION}" --project "${PROJECT_ID}" \
            --image "${PREVIOUS_CRON_IMAGE}" || rollback_failed=1
          if [[ -n "${PREVIOUS_WORKER_IMAGE:-}" ]]; then
            gcloud run services update "${WORKER_SERVICE}" \
              --region "${REGION}" --project "${PROJECT_ID}" \
              --image "${PREVIOUS_WORKER_IMAGE}" || rollback_failed=1
          fi
          if [[ "${rollback_failed}" -ne 0 ]]; then
            echo "Automatic rollback was incomplete; escalate immediately." >&2
            exit 1
          fi

      - name: Remove candidate traffic tag
        if: ${{ always() }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if [[ -z "${CANDIDATE_TAG:-}" ]]; then
            exit 0
          fi
          gcloud run services update-traffic "${SERVICE}" \
            --region "${REGION}" --project "${PROJECT_ID}" \
            --remove-tags "${CANDIDATE_TAG}"


  notify-result:
    name: Notify Slack — release result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    needs: [smoke, deploy]
    if: >-
      always() &&
      github.repository == 'solana-foundation/solana-developer-platform'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4.0.1

      - name: Notify Slack — deploy result
        env:
          GH_TOKEN: ${{ github.token }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_CI }}
          DOPPLER_PROJECT: solana-developer-platform
          DOPPLER_CONFIG: dev_ci
          SERVICE: sdp-api
          ENV: production
          STATUS: >-
            ${{ needs.deploy.result == 'success' && 'success' ||
                (needs.deploy.result == 'cancelled' || needs.smoke.result == 'cancelled') && 'cancelled' ||
                'failure' }}
          VERSION: ${{ inputs.release_tag != '' && inputs.release_tag || inputs.image_sha }}
          DEPLOY_SHA: ${{ inputs.release_sha != '' && inputs.release_sha || inputs.image_sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          COMMIT="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${DEPLOY_SHA}" \
            --jq '(.sha[0:7]) + " — " + (.commit.message | split("\n")[0])' 2>/dev/null || true)"
          export COMMIT
          ./scripts/notify-slack.sh
