name: Deploy sdp-api to Cloud Run (prod)

on:
  workflow_call:
    inputs:
      image_sha:
        description: "Merge commit to build and deploy (caller has already gated on the stage smoke)"
        type: string
        required: true
      approved_schema:
        description: "Set by apply-prod-migrations.yml after release-production approval: deploy image_sha and run its pending migrations"
        type: boolean
        required: false
        default: false
      clear_hold:
        description: "Set by apply-prod-migrations.yml when dispatched with clear_hold: deploy while prod is held and lift the hold once the canary passes"
        type: boolean
        required: false
        default: false
    outputs:
      rolled_back:
        description: "'true' when a rollout that failed before its canary was restored and prod is held"
        value: ${{ jobs.finish.outputs.rolled_back }}
      canary_failed:
        description: "'true' when the canary failed and prod is held on the new revision for a deliberate rollback"
        value: ${{ jobs.finish.outputs.canary_failed }}
  workflow_dispatch:
    inputs:
      image_sha:
        description: "Existing 40-character Git SHA image tag to redeploy (run from main)"
        type: string
        required: true
      clear_hold:
        description: "Lift sdp_prod_hold once this deploy passes its canary. Unchecked, this deploy holds prod so merge and approval deploys cannot replace it"
        type: boolean
        required: false
        default: false

permissions:
  actions: read
  contents: read
  id-token: write
  packages: read

concurrency:
  group: sdp-api-gcp-deploy-prod
  cancel-in-progress: false

env:
  PROJECT_ID: solana-developer-platform
  REGION: us-central1
  SERVICE: sdp-prod-api-public
  WORKER_SERVICE: sdp-prod-worker
  MIGRATE_JOB: sdp-prod-api-public-migrate

jobs:
  notify-start:
    name: Notify Slack — release started
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    if: >-
      github.repository == 'solana-foundation/solana-developer-platform' &&
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4.0.1

      - name: Doppler OIDC login
        run: scripts/doppler/oidc-login.sh "${{ vars.DOPPLER_CI_IDENTITY_ID }}"

      - name: Notify Slack — deploy started
        env:
          GH_TOKEN: ${{ github.token }}
          DOPPLER_PROJECT: solana-developer-platform
          DOPPLER_CONFIG: dev_ci
          SERVICE: sdp-api
          ENV: production
          STATUS: started
          VERSION: ${{ inputs.image_sha }}
          DEPLOY_SHA: ${{ inputs.image_sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          COMMIT="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${DEPLOY_SHA}" \
            --jq '(.sha[0:7]) + " — " + (.commit.message | split("\n")[0])' 2>/dev/null || true)"
          export COMMIT
          ./scripts/notify-slack.sh

  deploy:
    outputs:
      revision: ${{ steps.promote.outputs.revision }}
      rollout_started: ${{ steps.candidate.outcome == 'success' || steps.candidate.outcome == 'failure' || steps.candidate.outcome == 'cancelled' }}
      rollout_complete: ${{ steps.promote.outcome == 'success' }}
      canary_passed: ${{ steps.canary.outcome == 'success' }}
      candidate_tag: ${{ steps.candidate.outputs.tag }}
      previous_traffic: ${{ steps.capture.outputs.traffic }}
      previous_worker_image: ${{ steps.capture.outputs.worker_image }}
      breaking_migrations: ${{ steps.breaking.outputs.migrations }}
    name: Deploy production image
    if: >-
      github.repository == 'solana-foundation/solana-developer-platform' &&
      github.ref == 'refs/heads/main' &&
      (!inputs.approved_schema || vars.CONTINUOUS_PROD_DEPLOY == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: production
    env:
      REPO: sdp-prod
      BUILD_IMAGE: ${{ (github.event_name != 'workflow_dispatch' || inputs.approved_schema) && 'true' || 'false' }}
    steps:
      - name: Validate deploy image SHA
        env:
          DEPLOY_IMAGE_SHA: ${{ inputs.image_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${DEPLOY_IMAGE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "image_sha must be a lowercase 40-character Git SHA." >&2
            exit 1
          fi
          echo "DEPLOY_IMAGE_SHA=${DEPLOY_IMAGE_SHA}" >> "${GITHUB_ENV}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          ref: ${{ (inputs.approved_schema && inputs.image_sha) || github.sha }}

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4.0.1

      - name: Resolve commit summary
        run: echo "COMMIT_LINE=$(git log -1 --format='%h — %s' "${DEPLOY_IMAGE_SHA}" 2>/dev/null || true)" >> "${GITHUB_ENV}"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.DEPLOY_WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Read the schema position prod last applied
        run: |
          set -euo pipefail
          applied="$(gcloud run jobs describe "${MIGRATE_JOB}" \
            --region "${REGION}" --project "${PROJECT_ID}" \
            --format 'value(metadata.labels.sdp_schema_sha)')"
          if [[ "${applied}" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${applied}^{commit}" 2>/dev/null; then
            echo "APPLIED_SCHEMA_SHA=${applied}" >> "${GITHUB_ENV}"
          else
            echo "APPLIED_SCHEMA_SHA=" >> "${GITHUB_ENV}"
            echo "::warning::sdp_schema_sha on ${MIGRATE_JOB} is unset or unknown (${applied:-unset}); schema ordering is not checked for this deploy."
          fi

      - name: Refuse a merge or approval deploy while prod is held
        if: ${{ env.BUILD_IMAGE == 'true' && !inputs.clear_hold }}
        run: |
          set -euo pipefail
          hold="$(gcloud run jobs describe "${MIGRATE_JOB}" \
            --region "${REGION}" --project "${PROJECT_ID}" \
            --format 'value(metadata.labels.sdp_prod_hold)')"
          if [[ -n "${hold}" ]]; then
            echo "Prod is held (sdp_prod_hold=${hold}). Merge and approval deploys stay refused until a deploy dispatched with clear_hold passes its canary (docs/ops/release-operations.md, Production Rollback)." >&2
            exit 1
          fi

      - name: Refuse an approved deploy that was re-run or self-approved
        if: ${{ inputs.approved_schema }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [[ "${RUN_ATTEMPT}" != "1" ]]; then
            echo "Approved deploys cannot be re-run; dispatch a fresh approval run for ${DEPLOY_IMAGE_SHA}." >&2
            exit 1
          fi
          approvers="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/approvals" \
            --jq '[.[] | select(.state == "approved") | .user.login] | unique | .[]')"
          if [[ -z "${approvers}" ]]; then
            echo "No recorded release-production approval on run ${RUN_ID}." >&2
            exit 1
          fi
          since="${APPLIED_SCHEMA_SHA:-$(git describe --tags --abbrev=0 --match 'v*' origin/main)}"
          authors="$(
            for commit in $(git log --format=%H "${since}..${DEPLOY_IMAGE_SHA}" -- apps/sdp-api/src/db/migrations/postgres); do
              gh api "repos/${GITHUB_REPOSITORY}/commits/${commit}" \
                --jq '[.author.login // "unlinked", .committer.login // "unlinked"] | .[]'
            done | grep -vx 'web-flow' | sort -u
          )"
          if grep -qx 'unlinked' <<<"${authors}"; then
            echo "A pending migration commit has no GitHub-linked author, so self-approval cannot be ruled out. Link the author's email or re-commit before approving." >&2
            exit 1
          fi
          for approver in ${approvers}; do
            if grep -qx "${approver}" <<<"${authors}"; then
              echo "${approver} authored a pending migration and approved it; a different foundation member must approve." >&2
              exit 1
            fi
          done

      - name: Refuse a deploy that is behind prod
        if: ${{ env.BUILD_IMAGE == 'true' }}
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "${DEPLOY_IMAGE_SHA}" origin/main; then
            echo "${DEPLOY_IMAGE_SHA} is not on main." >&2
            exit 1
          fi
          floor="${APPLIED_SCHEMA_SHA:-$(git describe --tags --abbrev=0 --match 'v*' origin/main)}"
          if ! git merge-base --is-ancestor "${floor}" "${DEPLOY_IMAGE_SHA}"; then
            echo "Prod is at least at ${floor}, which ${DEPLOY_IMAGE_SHA} does not include. Deploy a newer commit instead." >&2
            exit 1
          fi

      - name: Refuse a non-migrating deploy that carries unapplied migrations
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.approved_schema }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLIED_SCHEMA_SHA}" ]]; then
            exit 0
          fi
          if git merge-base --is-ancestor "${DEPLOY_IMAGE_SHA}" "${APPLIED_SCHEMA_SHA}"; then
            exit 0
          fi
          pending="$(git diff --name-only "${APPLIED_SCHEMA_SHA}" "${DEPLOY_IMAGE_SHA}" -- apps/sdp-api/src/db/migrations/postgres)"
          if [[ -n "${pending}" ]]; then
            printf '%s carries migration changes prod has not applied:\n%s\nMigrations reach prod only through "Apply pending migrations to prod"; approve the held run for this commit first.\n' \
              "${DEPLOY_IMAGE_SHA}" "${pending}" >&2
            exit 1
          fi

      # A breaking migration drops what the serving image may still read, and it
      # runs before the candidate takes traffic. Apply one only while prod serves
      # the commit before its last pending edit, which no longer reads what it drops.
      - name: Refuse a breaking migration until prod serves its parent
        id: breaking
        if: ${{ env.BUILD_IMAGE == 'true' }}
        run: |
          set -euo pipefail
          since="${APPLIED_SCHEMA_SHA:-$(git describe --tags --abbrev=0 --match 'v*' origin/main)}"
          changed="$(git diff --name-only --no-renames --diff-filter=AM "${since}" "${DEPLOY_IMAGE_SHA}" -- apps/sdp-api/src/db/migrations/postgres)"
          breaking=()
          for file in ${changed}; do
            sql="$(git show "${DEPLOY_IMAGE_SHA}:${file}")"
            if grep -Eq '^--[[:space:]]*sdp:migration-compat:[[:space:]]*breaking[[:space:]]*$' <<<"${sql}"; then
              breaking+=("${file}")
            fi
          done
          if [[ "${#breaking[@]}" -eq 0 ]]; then
            exit 0
          fi

          service_json="$(
            gcloud run services describe "${SERVICE}" \
              --region "${REGION}" --project "${PROJECT_ID}" --format=json
          )"
          serving_revision="$(
            jq -er '
              [.status.traffic[] | select((.percent // 0) > 0)]
              | if length != 1 then error("production traffic is not on exactly one revision")
                elif (.[0].revisionName // "") == "" then error("the serving traffic target has no resolved revisionName")
                else .[0].revisionName end
            ' <<<"${service_json}"
          )"
          serving=""
          for attempt in 1 2 3; do
            if serving="$(
              curl --fail --silent --show-error --max-time 10 "https://api.solana.com/health/ready" |
                jq -er --arg revision "${serving_revision}" 'select(.revision == $revision) | .commit'
            )" && [[ "${serving}" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${serving}^{commit}" 2>/dev/null; then
              break
            fi
            serving=""
            if [[ "${attempt}" -eq 3 ]]; then
              echo "Could not read the commit ${serving_revision} serves from /health/ready, so these breaking migrations cannot be ordered against it: ${breaking[*]}" >&2
              exit 1
            fi
            sleep 10
          done
          for file in "${breaking[@]}"; do
            edited="$(git log --format=%H -n 1 "${since}..${DEPLOY_IMAGE_SHA}" -- "${file}")"
            if ! git merge-base --is-ancestor "${edited}^" "${serving}"; then
              echo "${file} is marked breaking, so it runs only once prod serves ${edited}^, the commit before its last pending edit. Prod serves ${serving}; deploy that parent first." >&2
              exit 1
            fi
          done
          echo "migrations=${breaking[*]}" >> "${GITHUB_OUTPUT}"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      - name: Log in to GHCR
        if: ${{ env.BUILD_IMAGE == 'true' }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --password-stdin keeps the token off the command line, where it would
        # be visible in the process table and in any error echo-back.
        run: printf '%s' "$GHCR_TOKEN" | crane auth login ghcr.io -u "${{ github.actor }}" --password-stdin

      # The merge image was built, scanned, attested, and keyless-signed by
      # release-images.yml on the push to main. Verify that signature against
      # this exact commit and promote the SAME digest — merge deploys ship the
      # identical trust chain as releases, never a rebuild.
      # The wait covers release-images.yml's 60-minute publish timeout.
      - name: Verify and promote merge image
        if: ${{ env.BUILD_IMAGE == 'true' }}
        timeout-minutes: 75
        run: |
          set -euo pipefail
          SRC_BASE="ghcr.io/${{ github.repository_owner }}/sdp/sdp-api"
          SRC_DIGEST=""
          for attempt in $(seq 1 130); do
            if SRC_DIGEST="$(crane digest "${SRC_BASE}:${DEPLOY_IMAGE_SHA}" 2>/dev/null)"; then
              break
            fi
            echo "merge image not in GHCR yet (attempt ${attempt}/130); retrying in 30s"
            sleep 30
          done
          if [[ -z "${SRC_DIGEST}" ]]; then
            echo "merge image ${SRC_BASE}:${DEPLOY_IMAGE_SHA} never appeared in GHCR." >&2
            exit 1
          fi
          verified=""
          for attempt in $(seq 1 10); do
            if cosign verify "${SRC_BASE}@${SRC_DIGEST}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release-images.yml@refs/heads/main" \
              --certificate-github-workflow-sha "${DEPLOY_IMAGE_SHA}"; then
              verified=true
              break
            fi
            echo "signature not verifiable yet (attempt ${attempt}/10); retrying in 30s"
            sleep 30
          done
          if [[ -z "${verified}" ]]; then
            echo "cosign verification failed for ${SRC_BASE}@${SRC_DIGEST}." >&2
            exit 1
          fi
          DEST_BASE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/sdp-api-public"
          cosign copy --force "${SRC_BASE}@${SRC_DIGEST}" "${DEST_BASE}:${DEPLOY_IMAGE_SHA}"
          echo "SRC_DIGEST=${SRC_DIGEST}" >> "${GITHUB_ENV}"


      - name: Resolve immutable deploy image
        run: |
          set -euo pipefail
          image_base="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/sdp-api-public"
          tagged_image="${image_base}:${DEPLOY_IMAGE_SHA}"
          resolved_image="$(
            gcloud artifacts docker images describe "${tagged_image}" \
              --project "${PROJECT_ID}" \
              --format='value(image_summary.fully_qualified_digest)'
          )"
          expected_prefix="${image_base}@"
          if [[ "${resolved_image}" != "${expected_prefix}"* ]]; then
            echo "Artifact Registry returned an unexpected image reference for ${tagged_image}." >&2
            exit 1
          fi
          digest="${resolved_image:${#expected_prefix}}"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Artifact Registry returned an invalid digest for ${tagged_image}." >&2
            exit 1
          fi
          if [[ -n "${SRC_DIGEST:-}" && "${digest}" != "${SRC_DIGEST}" ]]; then
            echo "Artifact Registry digest ${digest} does not match the verified release digest ${SRC_DIGEST}." >&2
            exit 1
          fi
          echo "IMAGE=${resolved_image}" >> "${GITHUB_ENV}"
          echo "Deploying ${tagged_image} as ${resolved_image}" >> "${GITHUB_STEP_SUMMARY}"

      # Rollback path (workflow_dispatch by git sha): the AR image must carry
      # the signature copied at its original promotion — release-tag or
      # merge-to-main identity both satisfy the policy. An image that predates
      # signed promotion fails here by design; break-glass is documented in the
      # HOO-991 design note.
      - name: Verify rollback image signature
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.approved_schema }}
        run: |
          set -euo pipefail
          # Modern cosign stores signatures as OCI referrer bundles, which
          # `cosign copy` does not yet carry into Artifact Registry, so the AR
          # copy can hold the image without a findable signature. Trust follows
          # the content-addressed digest, not the registry: verify AR first,
          # and when AR has no signature, verify the signing origin (GHCR) at
          # the exact same digest the deploy is pinned to. Anything else still
          # fails closed.
          verify_flags=(
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/\.github/workflows/release-images\.yml@(refs/tags/v.+|refs/heads/main)$"
            --certificate-github-workflow-sha "${DEPLOY_IMAGE_SHA}"
          )
          if cosign verify "${IMAGE}" "${verify_flags[@]}"; then
            exit 0
          fi
          echo "No verifiable signature on the AR copy; verifying the signing origin at the pinned digest." >&2
          ORIGIN_IMAGE="ghcr.io/${{ github.repository_owner }}/sdp/sdp-api@${IMAGE##*@}"
          cosign verify "${ORIGIN_IMAGE}" "${verify_flags[@]}"

      - name: Capture rollback state
        id: capture
        run: |
          set -euo pipefail
          service_json="$(
            gcloud run services describe "${SERVICE}" \
              --region "${REGION}" --project "${PROJECT_ID}" --format=json
          )"
          previous_traffic="$(
            jq -er '
              [.status.traffic[]
                | select((.percent // 0) > 0)
                | if (.revisionName // "") != "" then
                    "\(.revisionName)=\(.percent)"
                  else error("active traffic target has no resolved revisionName") end]
              | if length > 0 then join(",") else error("service has no active traffic targets") end
            ' <<<"${service_json}"
          )"
          echo "traffic=${previous_traffic}" >> "${GITHUB_OUTPUT}"
          previous_worker_image="$(
            gcloud run services describe "${WORKER_SERVICE}" \
              --region "${REGION}" --project "${PROJECT_ID}" \
              --format='value(spec.template.spec.containers[0].image)'
          )"
          if [[ -z "${previous_worker_image}" ]]; then
            echo "Could not resolve the current worker image." >&2
            exit 1
          fi
          echo "worker_image=${previous_worker_image}" >> "${GITHUB_OUTPUT}"

      - name: Run database migrations
        if: ${{ env.BUILD_IMAGE == 'true' }}
        timeout-minutes: 15
        env:
          BREAKING_MIGRATIONS: ${{ steps.breaking.outputs.migrations }}
        run: |
          set -euo pipefail
          # The previous build cannot run on the schema a breaking migration leaves.
          if [[ -n "${BREAKING_MIGRATIONS}" ]]; then
            gcloud run jobs update "${MIGRATE_JOB}" \
              --region "${REGION}" --project "${PROJECT_ID}" --remove-labels sdp_prod_previous_revision
          fi
          gcloud run jobs update "${MIGRATE_JOB}" \
            --region "${REGION}" --project "${PROJECT_ID}" --image "${IMAGE}"
          gcloud run jobs execute "${MIGRATE_JOB}" \
            --region "${REGION}" --project "${PROJECT_ID}" --wait
          gcloud run jobs update "${MIGRATE_JOB}" \
            --region "${REGION}" --project "${PROJECT_ID}" --update-labels "sdp_schema_sha=${DEPLOY_IMAGE_SHA}"

      - name: Hold prod for a manual deploy
        if: ${{ env.BUILD_IMAGE != 'true' && !inputs.clear_hold }}
        run: |
          set -euo pipefail
          gcloud run jobs update "${MIGRATE_JOB}" \
            --region "${REGION}" --project "${PROJECT_ID}" \
            --update-labels "sdp_prod_hold=${DEPLOY_IMAGE_SHA}"
          echo "Holding prod at ${DEPLOY_IMAGE_SHA}: merge and approval deploys refuse until a deploy dispatched with clear_hold passes its canary." >> "${GITHUB_STEP_SUMMARY}"

      - name: Deploy candidate without production traffic
        id: candidate
        timeout-minutes: 5
        run: |
          set -euo pipefail
          candidate_tag="candidate-${DEPLOY_IMAGE_SHA:0:12}"
          echo "tag=${candidate_tag}" >> "${GITHUB_OUTPUT}"
          gcloud run services update "${SERVICE}" \
            --region "${REGION}" --project "${PROJECT_ID}" --image "${IMAGE}" \
            --no-traffic --tag "${candidate_tag}"

          service_json="$(
            gcloud run services describe "${SERVICE}" \
              --region "${REGION}" --project "${PROJECT_ID}" --format=json
          )"
          candidate_revision="$(
            jq -er --arg tag "${candidate_tag}" '
              [.status.traffic[] | select(.tag == $tag)][0].revisionName
                // error("candidate traffic tag is missing a revision")
            ' <<<"${service_json}"
          )"
          revision_digest="$(
            gcloud run revisions describe "${candidate_revision}" \
              --region "${REGION}" --project "${PROJECT_ID}" \
              --format='value(status.imageDigest)'
          )"
          expected_digest="${IMAGE##*@}"
          # The pinned digest may be an OCI image index (buildx provenance/SBOM
          # builds). Cloud Run resolves the index and records the platform
          # manifest's digest on the revision, so accept the pinned digest or
          # any manifest listed inside that exact signed index. Children are
          # content-addressed by the index, so this extends the trust chain
          # without widening it; anything else still fails closed.
          accepted_digests="${expected_digest}"
          if ! pinned_manifest="$(crane manifest "${IMAGE}")"; then
            echo "Failed to fetch the pinned manifest for ${expected_digest}; cannot enumerate signed-index children." >&2
            exit 1
          fi
          if ! index_children="$(
            jq -r 'select(.mediaType == "application/vnd.oci.image.index.v1+json"
                     or .mediaType == "application/vnd.docker.distribution.manifest.list.v2+json")
                   | .manifests[]?.digest' <<<"${pinned_manifest}"
          )"; then
            echo "Failed to parse the pinned manifest for ${expected_digest}; cannot enumerate signed-index children." >&2
            exit 1
          fi
          if [[ -n "${index_children}" ]]; then
            accepted_digests+=$'\n'"${index_children}"
          fi
          if ! grep -qxF "${revision_digest##*@}" <<<"${accepted_digests}"; then
            echo "Candidate ${candidate_revision} resolved to ${revision_digest}, expected ${expected_digest} or a manifest of that signed index." >&2
            exit 1
          fi
          echo "CANDIDATE_REVISION=${candidate_revision}" >> "${GITHUB_ENV}"
          echo "Candidate revision: ${candidate_revision}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify candidate revision readiness
        timeout-minutes: 5
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            revision_json="$(
              gcloud run revisions describe "${CANDIDATE_REVISION}" \
                --region "${REGION}" --project "${PROJECT_ID}" --format=json
            )"
            if jq -e '
              [.status.conditions[]
                | select(.type == "Ready" and .status == "True")]
              | length == 1
            ' <<<"${revision_json}" >/dev/null; then
              echo "Candidate ${CANDIDATE_REVISION} is ready to serve traffic."
              exit 0
            fi
            if [[ "${attempt}" -eq 12 ]]; then
              echo "Candidate revision did not become ready after ${attempt} attempts." >&2
              false
            fi
            sleep 10
          done

      - name: Promote service and worker with rollback
        id: promote
        timeout-minutes: 10
        env:
          PREVIOUS_TRAFFIC: ${{ steps.capture.outputs.traffic }}
          BREAKING_MIGRATIONS: ${{ steps.breaking.outputs.migrations }}
        run: |
          set -euo pipefail

          # The quick rollback returns to the build this one replaces, unless a
          # breaking migration means that build can no longer run on the schema.
          # Recorded before traffic moves, so a failed switch or restore still
          # leaves the right target.
          if [[ -z "${BREAKING_MIGRATIONS}" && "${PREVIOUS_TRAFFIC}" =~ ^([a-z0-9-]+)=100$ ]]; then
            gcloud run jobs update "${MIGRATE_JOB}" \
              --region "${REGION}" --project "${PROJECT_ID}" \
              --update-labels "sdp_prod_previous_revision=${BASH_REMATCH[1]}"
          else
            gcloud run jobs update "${MIGRATE_JOB}" \
              --region "${REGION}" --project "${PROJECT_ID}" --remove-labels sdp_prod_previous_revision
          fi

          gcloud run services update-traffic "${SERVICE}" \
            --region "${REGION}" --project "${PROJECT_ID}" \
            --to-revisions "${CANDIDATE_REVISION}=100"

          for attempt in {1..12}; do
            if response="$(
              curl --fail --silent --show-error --max-time 10 \
                "https://api.solana.com/health/ready"
            )" && jq -e --arg revision "${CANDIDATE_REVISION}" '
              .status == "ready"
              and .revision == $revision
              and .checks.database == "ok"
              and .checks.redis == "ok"
            ' <<<"${response}" >/dev/null; then
              break
            fi
            if [[ "${attempt}" -eq 12 ]]; then
              echo "Canonical production traffic did not reach ${CANDIDATE_REVISION}." >&2
              false
            fi
            sleep 10
          done

          # The Worker is the only scheduler (ADR 0011): a missing service means no Money Exit
          # runs, so this fails the deploy instead of skipping.
          gcloud run services update "${WORKER_SERVICE}" \
            --region "${REGION}" --project "${PROJECT_ID}" --image "${IMAGE}"
          echo "revision=${CANDIDATE_REVISION}" >> "${GITHUB_OUTPUT}"

      # Three failed runs in a row hold prod on this revision for a deliberate
      # rollback; they also count toward the prod canary paging rule.
      - name: Run prod canary against the promoted revision
        id: canary
        if: ${{ steps.promote.outcome == 'success' }}
        timeout-minutes: 12
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gcloud run jobs execute sdp-prod-canary \
              --region "${REGION}" --project "${PROJECT_ID}" --wait; then
              exit 0
            fi
            echo "::warning::Canary run ${attempt} of 3 failed."
            if [[ "${attempt}" -lt 3 ]]; then
              sleep 30
            fi
          done
          echo "::error::The canary failed 3 runs in a row against the promoted revision."
          exit 1

      - name: Lift the prod hold
        if: ${{ steps.canary.outcome == 'success' && inputs.clear_hold }}
        run: |
          set -euo pipefail
          gcloud run jobs update "${MIGRATE_JOB}" \
            --region "${REGION}" --project "${PROJECT_ID}" --remove-labels sdp_prod_hold
          echo "Lifted sdp_prod_hold: merge and approval deploys resume." >> "${GITHUB_STEP_SUMMARY}"

  # Its own job, so a cancel cannot cut it short: the deploy job stays
  # cancellable, and this one starts once it ends, under always().
  finish:
    name: Restore or hold prod, then untag the candidate
    needs: deploy
    if: ${{ always() && needs.deploy.outputs.rollout_started == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    outputs:
      rolled_back: ${{ steps.settle.outputs.rolled_back }}
      canary_failed: ${{ steps.settle.outputs.canary_failed }}
    env:
      DEPLOY_IMAGE_SHA: ${{ inputs.image_sha }}
      ROLLOUT_STARTED: ${{ needs.deploy.outputs.rollout_started }}
      ROLLOUT_COMPLETE: ${{ needs.deploy.outputs.rollout_complete }}
      CANARY_PASSED: ${{ needs.deploy.outputs.canary_passed }}
      BREAKING_MIGRATIONS: ${{ needs.deploy.outputs.breaking_migrations }}
      PREVIOUS_TRAFFIC: ${{ needs.deploy.outputs.previous_traffic }}
      PREVIOUS_WORKER_IMAGE: ${{ needs.deploy.outputs.previous_worker_image }}
      CANDIDATE_TAG: ${{ needs.deploy.outputs.candidate_tag }}
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.DEPLOY_WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # A deploy that fails after it starts changing prod holds prod. It restores
      # the previous build only when the rollout never completed and no breaking
      # migration ran; after a promotion, rolling back is a deliberate step.
      - name: Restore an incomplete rollout or hold prod
        id: settle
        if: ${{ always() }}
        timeout-minutes: 5
        run: |
          set -uo pipefail
          if [[ "${ROLLOUT_STARTED:-}" != "true" || "${CANARY_PASSED:-}" == "true" ]]; then
            exit 0
          fi
          hold=(gcloud run jobs update "${MIGRATE_JOB}" --region "${REGION}" --project "${PROJECT_ID}"
            --update-labels "sdp_prod_hold=${DEPLOY_IMAGE_SHA}")

          if [[ "${ROLLOUT_COMPLETE:-}" == "true" ]]; then
            next="run \"Roll back sdp-api prod to the previous build\" or fix forward"
            if [[ -n "${BREAKING_MIGRATIONS:-}" ]]; then
              next="fix forward, since the previous build cannot run on the schema this run migrated"
            fi
            if ! "${hold[@]}"; then
              echo "::error::The canary failed on ${DEPLOY_IMAGE_SHA} and sdp_prod_hold could not be set. Pause merges by hand, then ${next}."
              exit 1
            fi
            echo "canary_failed=true" >> "${GITHUB_OUTPUT}"
            echo "::error::The canary failed on ${DEPLOY_IMAGE_SHA}. Prod stays on it and is held: ${next}."
            echo "Canary failed on ${DEPLOY_IMAGE_SHA}. Prod stays on it and is held (sdp_prod_hold): ${next}." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          if [[ -n "${BREAKING_MIGRATIONS:-}" ]]; then
            "${hold[@]}"
            echo "::error::This run applied breaking migrations (${BREAKING_MIGRATIONS}) that the previous image cannot run on, so it does not restore it. Production keeps its current traffic and worker image and is held; fix forward."
            exit 1
          fi

          echo "Rollout did not complete; restoring service traffic and the worker image and holding prod." >&2
          rollback_failed=0
          # Traffic first: users are on the failed revision until it moves, and
          # the hold only has to land before this run ends.
          gcloud run services update-traffic "${SERVICE}" \
            --region "${REGION}" --project "${PROJECT_ID}" \
            --to-revisions "${PREVIOUS_TRAFFIC}" || rollback_failed=1
          "${hold[@]}" || rollback_failed=1
          gcloud run services update "${WORKER_SERVICE}" \
            --region "${REGION}" --project "${PROJECT_ID}" \
            --image "${PREVIOUS_WORKER_IMAGE}" || rollback_failed=1
          if [[ "${rollback_failed}" -ne 0 ]]; then
            echo "Automatic restore was incomplete; escalate immediately. The quick rollback can finish it." >&2
            exit 1
          fi
          # Only once everything is back: until then the quick rollback needs
          # sdp_prod_previous_revision to finish the job.
          gcloud run jobs update "${MIGRATE_JOB}" \
            --region "${REGION}" --project "${PROJECT_ID}" --remove-labels sdp_prod_previous_revision ||
            echo "::warning::Could not clear sdp_prod_previous_revision; the quick rollback would only re-apply the restored build."
          echo "rolled_back=true" >> "${GITHUB_OUTPUT}"
          echo "Restored the build ${DEPLOY_IMAGE_SHA} replaced and set sdp_prod_hold=${DEPLOY_IMAGE_SHA}. Merge and approval deploys refuse until a deploy dispatched with clear_hold passes its canary." >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove candidate traffic tag
        id: remove_tag
        if: ${{ always() }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if [[ -z "${CANDIDATE_TAG:-}" ]]; then
            exit 0
          fi
          gcloud run services update-traffic "${SERVICE}" \
            --region "${REGION}" --project "${PROJECT_ID}" \
            --remove-tags "${CANDIDATE_TAG}"

  # sdp-web requires this status as a Vercel Deployment Check, so Vercel holds
  # each commit's production web build until production serves that commit's
  # API. Merge and approved-migration deploys post it, reruns included; a
  # manual rollback never does. It posts only while production still serves the
  # revision this run promoted, so a newer deploy or a rollback since then can
  # never be followed by a late release of this commit's web.
  release-web:
    name: Release sdp-web production for the deployed commit
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.approved_schema) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Post the sdp-web production gate status
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_SHA: ${{ inputs.image_sha }}
          DEPLOYED_REVISION: ${{ needs.deploy.outputs.revision }}
        run: |
          set -euo pipefail
          serving=""
          for attempt in 1 2 3; do
            if serving="$(curl --fail --silent --show-error --max-time 10 "https://api.solana.com/health/ready" | jq -er '.revision')"; then
              break
            fi
            sleep $((attempt * 10))
          done
          if [[ -z "${serving}" ]]; then
            echo "Could not read the serving revision; web stays held for ${IMAGE_SHA}." >&2
            exit 1
          fi
          if [[ "${serving}" != "${DEPLOYED_REVISION}" ]]; then
            echo "Production now serves ${serving}, not ${DEPLOYED_REVISION} from ${IMAGE_SHA}; leaving its web held." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          for attempt in 1 2 3; do
            if gh api "repos/${GITHUB_REPOSITORY}/statuses/${IMAGE_SHA}" \
              -f state=success -f context="sdp-web production gate" -f description="Production API serves this commit"; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "Could not post the sdp-web production gate for ${IMAGE_SHA}; rerun this job to release web." >&2
          exit 1

  notify-result:
    name: Notify Slack — release result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    needs: [deploy, finish, release-web]
    if: >-
      always() &&
      github.repository == 'solana-foundation/solana-developer-platform' &&
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4.0.1

      - name: Doppler OIDC login
        run: scripts/doppler/oidc-login.sh "${{ vars.DOPPLER_CI_IDENTITY_ID }}"

      - name: Notify Slack — deploy result
        env:
          GH_TOKEN: ${{ github.token }}
          DOPPLER_PROJECT: solana-developer-platform
          DOPPLER_CONFIG: dev_ci
          SERVICE: sdp-api
          ENV: production
          STATUS: >-
            ${{ needs.deploy.result == 'success' && (needs.finish.result == 'success' || needs.finish.result == 'skipped') && (needs.release-web.result == 'success' || needs.release-web.result == 'skipped') && 'success' ||
                needs.deploy.result == 'success' && (needs.finish.result == 'success' || needs.finish.result == 'skipped') && 'web-held' ||
                needs.finish.outputs.canary_failed == 'true' && 'canary-failed' ||
                needs.finish.outputs.rolled_back == 'true' && 'rolled-back' ||
                needs.deploy.result == 'cancelled' && 'cancelled' ||
                'failure' }}
          VERSION: ${{ inputs.image_sha }}
          DEPLOY_SHA: ${{ inputs.image_sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          COMMIT="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${DEPLOY_SHA}" \
            --jq '(.sha[0:7]) + " — " + (.commit.message | split("\n")[0])' 2>/dev/null || true)"
          export COMMIT
          ./scripts/notify-slack.sh
