name: Deploy sdp-web to Vercel (prod)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag or SHA) to deploy"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: sdp-web-vercel-deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production build
    if: >-
      github.repository == 'solana-foundation/solana-developer-platform' &&
      github.ref == 'refs/heads/main' &&
      inputs.ref != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@58.9.4

      - name: Build and deploy production artifact
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          : "${VERCEL_ORG_ID:?VERCEL_ORG_ID is not configured in the production environment}"
          : "${VERCEL_PROJECT_ID:?VERCEL_PROJECT_ID is not configured in the production environment}"
          : "${VERCEL_TOKEN:?VERCEL_TOKEN is not configured in the production environment}"

          vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"
          vercel build --prod --token="${VERCEL_TOKEN}"
          vercel deploy --prebuilt --prod --token="${VERCEL_TOKEN}"
