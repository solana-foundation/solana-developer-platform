name: Deploy PR to dev (label-triggered)

on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read
  id-token: write

# A different group from the reusable workflow it calls on purpose: sharing
# `sdp-api-gcp-deploy-dev` with the callee queues the callee behind this run,
# which GitHub reports as a concurrency deadlock and fails with no jobs. The
# callee's own group still serialises label deploys against dispatch deploys.
concurrency:
  group: sdp-api-gcp-deploy-dev-label
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy this PR branch to dev
    if: >-
      github.repository == 'solana-foundation/solana-developer-platform' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'deploy-dev')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-sdp-api-gcp.yml
