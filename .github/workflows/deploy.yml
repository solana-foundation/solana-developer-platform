name: SDP Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      services:
        description: "Services to deploy (auto = detect from changed files vs HEAD^)"
        required: false
        type: choice
        default: auto
        options: [auto, none, api]

permissions:
  contents: read
  id-token: write

concurrency:
  group: sdp-deploy-main
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.repository == 'solana-foundation/solana-developer-platform' && github.ref == 'refs/heads/main'
    outputs:
      api: ${{ steps.detect.outputs.api }}
      prod: ${{ steps.detect.outputs.prod }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - id: detect
        env:
          MODE: ${{ inputs.services || 'auto' }}
          EVENT_NAME: ${{ github.event_name }}
          CONTINUOUS_PROD_DEPLOY: ${{ vars.CONTINUOUS_PROD_DEPLOY }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            CHANGED_FILES=$(git diff --name-only "$BEFORE" HEAD)
          else
            CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)
          fi
          match() { echo "$CHANGED_FILES" | grep -qE "$1"; }

          api=false
          case "$MODE" in
            none) ;;
            api) api=true ;;
            auto|*)
              if match "^(apps/sdp-api/|packages/|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.github/workflows/deploy(-sdp-api-gcp(-prod|-stage)?)?\.yml|\.github/workflows/sdp-stage-smoke\.yml)"; then
                api=true
              fi
              ;;
          esac
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "Services to deploy: api=$api (api carries the worker, cron, and migrate jobs — one image)" >> "$GITHUB_STEP_SUMMARY"

          prod=false
          if [ "$api" = true ] && [ "$EVENT_NAME" = push ] && [ "$CONTINUOUS_PROD_DEPLOY" = true ] \
            && [[ "$HEAD_COMMIT_MESSAGE" != "chore(main): release"* ]]; then
            prod=true
          fi
          echo "prod=$prod" >> "$GITHUB_OUTPUT"


  notify-start:
    needs: changes
    if: needs.changes.outputs.api == 'true' && vars.STAGE_DEPLOY_WIF_PROVIDER != '' && vars.STAGE_DEPLOY_SA != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4.0.1

      - name: Doppler OIDC login
        run: |
          oidc_jwt=$(curl -sf -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://github.com/solana-foundation" | jq -r '.value')
          doppler oidc login --scope=. --identity="${{ vars.DOPPLER_CI_IDENTITY_ID }}" --token="${oidc_jwt}"

      - name: Notify Slack — deploy started
        env:
          SERVICES: api
          TARGETS: >-
            ${{ needs.changes.outputs.prod == 'true' && 'stage → prod' || 'stage' }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          SLACK=$(doppler secrets get SLACK_DEPLOY_WEBHOOK_URL --plain --scope=. --project solana-developer-platform --config dev_ci 2>/dev/null || true)
          [ -z "$SLACK" ] && exit 0
          echo "::add-mask::$SLACK"
          SHA=$(git rev-parse HEAD)
          COMMIT_MSG=$(git log -1 --format=%s HEAD 2>/dev/null | cut -c1-140 || echo "")
          PAYLOAD=$(jq -n \
            --arg marker "[STARTED] SDP Deploy" --arg targets "$TARGETS" \
            --arg services "$SERVICES" \
            --arg short_sha "${SHA:0:7}" --arg commit_msg "$COMMIT_MSG" \
            --arg actor "$ACTOR" --arg run_url "$RUN_URL" --arg run_id "$RUN_ID" \
            '{
              text: ("*" + $marker + "* — services: `" + $services + "` · targets: `" + $targets + "`"),
              attachments: [{
                color: "#36a64f",
                blocks: [
                  {type:"section", text:{type:"mrkdwn", text:("*" + $marker + "*")}},
                  {type:"section", fields:[
                    {type:"mrkdwn",text:("*Services:*\n`"+$services+"`")},
                    {type:"mrkdwn",text:("*Commit:*\n`"+$short_sha+"` — "+$commit_msg)},
                    {type:"mrkdwn",text:("*Triggered by:*\n"+$actor)},
                    {type:"mrkdwn",text:("*Run:*\n<"+$run_url+"|workflow #"+$run_id+">")}
                  ]}
                ]
              }]
            }')
          curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' --data "$PAYLOAD" "$SLACK" || true

  notify-end:
    needs: [changes, deploy-api-stage, schema, deploy-api-prod, request-schema-approval]
    if: always() && needs.deploy-api-stage.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4.0.1

      - name: Doppler OIDC login
        run: |
          oidc_jwt=$(curl -sf -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://github.com/solana-foundation" | jq -r '.value')
          doppler oidc login --scope=. --identity="${{ vars.DOPPLER_CI_IDENTITY_ID }}" --token="${oidc_jwt}"

      - name: Notify Slack — deploy result
        env:
          SERVICES: api
          TARGETS: >-
            ${{ needs.request-schema-approval.result == 'success' && 'stage (prod held: pending migrations, approval run dispatched)' ||
                needs.schema.outputs.pending == 'true' && 'stage (prod held: pending migrations, approval not dispatched)' ||
                needs.deploy-api-prod.result != 'skipped' && 'stage → prod' ||
                'stage' }}
          OUTCOME: >-
            ${{ (needs.deploy-api-stage.result == 'failure' || needs.schema.result == 'failure' || needs.deploy-api-prod.result == 'failure' || needs.request-schema-approval.result == 'failure') && 'FAILED' ||
                (needs.deploy-api-stage.result == 'cancelled' || needs.schema.result == 'cancelled' || needs.deploy-api-prod.result == 'cancelled' || needs.request-schema-approval.result == 'cancelled') && 'CANCELLED' ||
                'SUCCESS' }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          SLACK=$(doppler secrets get SLACK_DEPLOY_WEBHOOK_URL --plain --scope=. --project solana-developer-platform --config dev_ci 2>/dev/null || true)
          [ -z "$SLACK" ] && exit 0
          echo "::add-mask::$SLACK"
          MARKER="[${OUTCOME}] SDP Deploy"
          COLOR="#36a64f"; [ "$OUTCOME" = "FAILED" ] && COLOR="#cc0000"; [ "$OUTCOME" = "CANCELLED" ] && COLOR="#808080"
          SHA=$(git rev-parse HEAD)
          COMMIT_MSG=$(git log -1 --format=%s HEAD 2>/dev/null | cut -c1-140 || echo "")
          PAYLOAD=$(jq -n \
            --arg marker "$MARKER" --arg color "$COLOR" --arg targets "$TARGETS" \
            --arg services "$SERVICES" \
            --arg short_sha "${SHA:0:7}" --arg commit_msg "$COMMIT_MSG" \
            --arg actor "$ACTOR" --arg run_url "$RUN_URL" --arg run_id "$RUN_ID" \
            '{
              text: ("*" + $marker + "* — services: `" + $services + "` · targets: `" + $targets + "`"),
              attachments: [{
                color: $color,
                blocks: [
                  {type:"section", text:{type:"mrkdwn", text:("*" + $marker + "*")}},
                  {type:"section", fields:[
                    {type:"mrkdwn",text:("*Services:*\n`"+$services+"`")},
                    {type:"mrkdwn",text:("*Commit:*\n`"+$short_sha+"` — "+$commit_msg)},
                    {type:"mrkdwn",text:("*Triggered by:*\n"+$actor)},
                    {type:"mrkdwn",text:("*Run:*\n<"+$run_url+"|workflow #"+$run_id+">")}
                  ]}
                ]
              }]
            }')
          curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' --data "$PAYLOAD" "$SLACK" || true

  deploy-api-stage:
    name: sdp-api + worker + cron — stage + smoke
    needs: changes
    if: needs.changes.outputs.api == 'true' && vars.STAGE_DEPLOY_WIF_PROVIDER != '' && vars.STAGE_DEPLOY_SA != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-sdp-api-gcp-stage.yml

  schema:
    name: Check pending migrations against prod
    needs: changes
    if: needs.changes.outputs.prod == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      pending: ${{ steps.pending.outputs.pending }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.DEPLOY_WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Diff migrations against the schema prod last applied
        id: pending
        run: |
          set -euo pipefail
          applied="$(gcloud run jobs describe sdp-prod-api-public-migrate \
            --region us-central1 --project solana-developer-platform \
            --format 'value(metadata.labels.sdp_schema_sha)')"
          if [[ "${applied}" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${applied}^{commit}" 2>/dev/null; then
            pending="$(git diff --name-only "${applied}..HEAD" -- apps/sdp-api/src/db/migrations/postgres)"
          else
            pending="prod schema position unknown (sdp_schema_sha=${applied:-unset}); see docs/ops/release-operations.md to seed it"
          fi
          if [[ -n "${pending}" ]]; then
            echo "pending=true" >> "${GITHUB_OUTPUT}"
            printf 'Prod merge deploy held. Once stage is green this run dispatches "Apply pending migrations to prod"; approve it in the release-production environment. Pending:\n\n%s\n' "${pending}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "pending=false" >> "${GITHUB_OUTPUT}"
          fi

  deploy-api-prod:
    name: sdp-api + worker + cron — prod
    needs: [changes, deploy-api-stage, schema]
    if: >-
      needs.changes.outputs.prod == 'true' &&
      needs.schema.outputs.pending == 'false' &&
      github.event_name == 'push' &&
      vars.CONTINUOUS_PROD_DEPLOY == 'true' &&
      !startsWith(github.event.head_commit.message, 'chore(main): release')
    permissions:
      contents: read
      id-token: write
      packages: read
    uses: ./.github/workflows/deploy-sdp-api-gcp-prod.yml
    with:
      image_sha: ${{ github.sha }}

  request-schema-approval:
    name: Request schema approval
    needs: [deploy-api-stage, schema]
    if: needs.schema.outputs.pending == 'true' && needs.deploy-api-stage.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Dispatch the approval run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run apply-prod-migrations.yml --repo "${{ github.repository }}" --ref main -f image_sha="${{ github.sha }}"
