name: Deploy sdp-api to Cloud Run (dev)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/sdp-api/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-sdp-api-gcp.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: sdp-api-gcp-deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    if: github.repository == 'solana-foundation/solana-developer-platform'
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: solana-developer-platform-dev
      REGION: us-central1
      REPO: sdp-dev
      SERVICE: sdp-dev-api-public
      JOB: sdp-dev-api-public-cron
      WORKER_SERVICE: sdp-dev-worker
      MIGRATE_JOB: sdp-dev-api-public-migrate
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4.0.1

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.DEPLOY_WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/sdp-api-public:${GITHUB_SHA}"
          docker build -f apps/sdp-api/Dockerfile --build-arg GIT_SHA="${GITHUB_SHA}" -t "${IMAGE}" .
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

      - name: Run database migrations
        run: |
          gcloud run jobs update "${MIGRATE_JOB}" \
            --region "${REGION}" --project "${PROJECT_ID}" --image "${IMAGE}"
          gcloud run jobs execute "${MIGRATE_JOB}" \
            --region "${REGION}" --project "${PROJECT_ID}" --wait

      - name: Deploy service
        run: |
          gcloud run services update "${SERVICE}" \
            --region "${REGION}" --project "${PROJECT_ID}" --image "${IMAGE}"

      - name: Update cron job image
        run: |
          node .github/scripts/verify-managed-reconciliation-cadence.mjs \
            "${JOB}" "${REGION}" "${PROJECT_ID}"
          gcloud run jobs update "${JOB}" \
            --region "${REGION}" --project "${PROJECT_ID}" --image "${IMAGE}"

      - name: Update worker image
        run: |
          describe_err="$(mktemp)"
          if gcloud run services describe "${WORKER_SERVICE}" \
            --region "${REGION}" --project "${PROJECT_ID}" >/dev/null 2>"${describe_err}"; then
            gcloud run services update "${WORKER_SERVICE}" \
              --region "${REGION}" --project "${PROJECT_ID}" --image "${IMAGE}"
          elif grep -qiE "NOT_FOUND|could not be found" "${describe_err}"; then
            echo "worker service ${WORKER_SERVICE} not created yet; skipping image update"
          else
            cat "${describe_err}" >&2
            exit 1
          fi

  smoke:
    name: Post-deploy dev smoke
    needs: deploy
    permissions:
      contents: read
    uses: ./.github/workflows/sdp-dev-smoke.yml
    secrets:
      DOPPLER_TOKEN_CI: ${{ secrets.DOPPLER_TOKEN_CI }}
