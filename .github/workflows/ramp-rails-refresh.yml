# Scheduled live ramp-rail discovery; on upstream drift opens a review PR (never auto-merged).
name: Ramp Rails Refresh

on:
  schedule:
    - cron: "0 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ramp-rails-refresh
  cancel-in-progress: false

env:
  BASH_ENV: ${{ github.workspace }}/.github/scripts/node-trust-env.sh

jobs:
  refresh:
    name: Discover live + open drift PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOPPLER_CONFIG: dev_ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.16.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate Doppler OIDC configuration
        run: |
          if [ -z "${{ vars.DOPPLER_CI_IDENTITY_ID }}" ]; then
            echo "DOPPLER_CI_IDENTITY_ID must be configured as a repository variable for live ramp rail discovery." >&2
            exit 1
          fi

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4.0.1

      - name: Doppler OIDC login
        run: scripts/doppler/oidc-login.sh "${{ vars.DOPPLER_CI_IDENTITY_ID }}"

      - name: Discover rails live
        run: pnpm --filter @sdp/api currencies:discover

      - name: Regenerate matrix from snapshots
        run: pnpm --filter @sdp/api ramp-support:generate

      - name: Summarize drift
        run: pnpm --silent --filter @sdp/api ramp-support:drift | tee "${{ runner.temp }}/ramp-rails-drift.txt"

      - name: Detect matrix/dump changes
        id: changes
        run: |
          if git status --porcelain -- apps/sdp-api/.ramp-support packages/sdp-types/src/generated/ramp.generated.ts | grep -q .; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Ramp rails in sync::Live discovery matches the committed matrix; no PR needed."
          fi

      # Minted after install and discovery so no third-party code sees it; a
      # GITHUB_TOKEN may not open PRs here, and its pushes would skip PR CI.
      - name: Create refresh app token
        id: refresh-app
        if: steps.changes.outputs.drift == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.0.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update drift PR
        if: steps.changes.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ steps.refresh-app.outputs.token }}
          DRIFT_SUMMARY: ${{ runner.temp }}/ramp-rails-drift.txt
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./scripts/ramp-support/open-drift-pr.sh
