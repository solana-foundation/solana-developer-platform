services:
  markets-demo:
    build:
      context: ../..
      dockerfile: apps/sdp-web/Dockerfile
      args:
        NEXT_PUBLIC_SDP_API_BASE_URL: http://localhost:8787
        NEXT_PUBLIC_SDP_DOCS_URL: http://localhost:3001
        NEXT_PUBLIC_SOLANA_NETWORK: devnet
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_c21va2UubG9jYWwuY2xlcmsuZGV2JA
    environment:
      CLERK_SECRET_KEY: sk_test_dummy_smoke_for_ci_only
      EARN_ENABLED: "true"
      MARKETS_ENABLED: "true"
      SDP_MARKETS_DEMO: "true"
    ports:
      - "127.0.0.1:${SDP_MARKETS_DEMO_PORT:-3100}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/demo/markets/treasury-solutions').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12
