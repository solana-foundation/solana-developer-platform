[package]
name = "sdp-intents-message"
description = "Solana messages of each version, decoded to SDP plan transactions, with no IO"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# The Solana crates are pinned to the versions that `sdp-intents-client` uses.
[dependencies]
bs58.workspace = true
sdp-intents-planner.workspace = true
sdp-intents-spec.workspace = true
serde_json.workspace = true
solana-address.workspace = true
solana-hash = "=4.6.0"
solana-instruction = "=3.5.1"
solana-message = { version = "=4.6.0", features = ["wincode"] }
solana-signature = "=3.5.2"
solana-transaction = { version = "=4.3.0", features = ["wincode"] }
wincode = "=0.6.3"

[lints]
workspace = true
