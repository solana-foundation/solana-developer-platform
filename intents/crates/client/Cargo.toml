[package]
name = "sdp-intents-client"
description = "Plans SDP intents over RPC, with no service"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# `solana-rpc-client` is the RPC client. The other Solana crates and `base64` are the types that its
# API takes and returns, pinned to the versions that it uses, so they add no code to the build.
[dependencies]
base64.workspace = true
bs58.workspace = true
sdp-intents-planner.workspace = true
sdp-intents-spec.workspace = true
solana-account-decoder-client-types = "=4.5.0-beta.0"
solana-address.workspace = true
solana-commitment-config = "=3.1.1"
solana-hash = "=4.7.0"
solana-instruction = "=4.0.0"
solana-message = "=6.0.0"
solana-rpc-client = "=4.5.0-beta.0"
solana-rpc-client-api = "=4.5.0-beta.0"
solana-signature = "=3.6.0"
solana-transaction = "=6.0.0"

[dev-dependencies]
sdp-intents-compiler.workspace = true
serde_json.workspace = true

[lints]
workspace = true
