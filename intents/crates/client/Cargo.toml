[package]
name = "sdp-intents-client"
description = "Plans SDP intents over RPC, with no service"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# `solana-rpc-client` is the RPC client. The other Solana crates and `base64` are the types that its
# API takes and returns, pinned to the versions that it uses, so they add no code to the build.
[dependencies]
base64.workspace = true
bs58.workspace = true
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sdp-intents-planner.workspace = true
sdp-intents-spec.workspace = true
serde_json.workspace = true
solana-account-decoder-client-types = "=4.3.2"
solana-address.workspace = true
solana-commitment-config = "=3.1.1"
solana-hash = "=4.6.0"
solana-instruction = "=3.5.1"
solana-keypair = "=3.1.2"
solana-message = "=4.6.0"
solana-rpc-client = "=4.3.2"
solana-rpc-client-api = "=4.3.2"
solana-signature = "=3.5.2"
solana-signer = "=3.0.1"
solana-transaction = "=4.3.0"

[dev-dependencies]
sdp-intents-compiler.workspace = true

[lints]
workspace = true
