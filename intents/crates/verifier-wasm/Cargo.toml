[package]
name = "sdp-intents-verifier-wasm"
description = "The SDP transaction verifier as a WebAssembly module, for `@sdp/intents-verifier`"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bs58.workspace = true
sdp-intents-message.workspace = true
sdp-intents-planner.workspace = true
sdp-intents-spec.workspace = true
serde_json.workspace = true

[dev-dependencies]
solana-hash = "=4.6.0"

# The workspace lints, except that `unsafe_code` is `deny`, not `forbid`. A WebAssembly export needs
# `#[no_mangle]`, which the lint counts as unsafe, so each export allows it.
[lints.rust]
unused_imports = "deny"
dead_code = "warn"
unused_variables = "warn"
deprecated = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
