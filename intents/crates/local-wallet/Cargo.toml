[package]
name = "sdp-intents-local-wallet"
description = "The playground's wallet: local keypairs that build, check, sign, and send, so that the intents service holds no key"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "sdp-intents-local-wallet"
path = "src/main.rs"

# The same `axum` and `tokio` as the service. The wallet calls the blocking client and the
# Privacy Rings SDK off the async runtime.
[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64.workspace = true
bs58.workspace = true
clap.workspace = true
sdp-intents-client.workspace = true
sdp-intents-planner.workspace = true
sdp-intents-privacy-rings.workspace = true
sdp-intents-registry-client.workspace = true
sdp-intents-spec.workspace = true
serde_json.workspace = true
solana-address.workspace = true
solana-keypair = "=3.1.2"
solana-signer = "=3.0.1"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "signal"] }

[lints]
workspace = true
