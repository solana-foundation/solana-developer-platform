[workspace]
resolver = "2"
members = [
    "crates/spec",
    "crates/compiler",
    "crates/engine",
    "crates/lighthouse",
    "crates/planner",
    "crates/registry-client",
    "crates/client",
    "crates/chain",
    "crates/service",
    "crates/cli",
]
# `crates/builder` and `crates/program-testing` belong to the programs workspace, because they
# depend on pinocchio and LiteSVM.
exclude = ["crates/builder", "crates/program-testing", "programs"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.95"

[workspace.dependencies]
base64 = "=0.23.1"
bs58 = "=0.5.1"
clap = { version = "=4.6.7", features = ["derive"] }
bytemuck = { version = "=1.25.2", features = ["derive", "min_const_generics"] }
sdp-intents-compiler = { path = "crates/compiler" }
sdp-intents-client = { path = "crates/client" }
sdp-intents-engine = { path = "crates/engine" }
sdp-intents-lighthouse = { path = "crates/lighthouse" }
sdp-intents-planner = { path = "crates/planner" }
sdp-intents-registry-client = { path = "crates/registry-client" }
sdp-intents-spec = { path = "crates/spec" }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
sha2 = "=0.11.1"
# A range, not an exact pin: the engine is built by this workspace and by `programs/`. LiteSVM
# pins `~2.7`, so both lockfiles hold 2.7 today, and each pins the exact version.
solana-address = { version = ">=2.7.0, <2.10.0", default-features = false }

[workspace.lints.rust]
unused_imports = "deny"
dead_code = "warn"
unused_variables = "warn"
deprecated = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
