[workspace]
resolver = "2"
members = ["spec", "compiler", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.99"

[workspace.dependencies]
bs58 = "=0.5.1"
clap = { version = "=4.6.7", features = ["derive"] }
bytemuck = { version = "=1.25.2", features = ["derive", "min_const_generics"] }
sdp-intents-compiler = { path = "compiler" }
sdp-intents-spec = { path = "spec" }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
sha2 = "=0.11.1"

[workspace.lints.rust]
unused_imports = "deny"
dead_code = "warn"
unused_variables = "warn"
deprecated = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
