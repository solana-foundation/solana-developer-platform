[package]
name = "test-builder"
description = "A builder for the tests of the builder library and the planner: one MoreAccounts round, then a System transfer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["no-log-ix-name"]
no-entrypoint = []
cpi = ["no-entrypoint"]
idl-build = []
no-log-ix-name = []

[dependencies]
anchor-lang.workspace = true
sdp-intents-builder = { path = "../builder" }

[dev-dependencies]
anchor-v2-testing.workspace = true
sdp-intents-planner = { path = "../../planner" }
sdp-intents-program-testing = { path = "../testing" }

[lints]
workspace = true
