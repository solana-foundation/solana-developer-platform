# The onchain programs, and the crates in `../crates` that they and their tests share. This workspace
# has its own Cargo.lock, so the Anchor v2 dependencies never unify with those of the service.
[workspace]
resolver = "2"
members = [
    "../crates/builder",
    "../crates/program-testing",
    "jupiter-lend-builder",
    "kamino-builder",
    "registry",
    "test-builder",
    "test-transfer-hook",
    "token-2022-builder",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.95"

[workspace.dependencies]
anchor-lang = { git = "https://github.com/otter-sec/anchor", rev = "7d28d8b5fde8d46b204ebf161c9db3956801146a", default-features = false, features = ["alloc"] }
anchor-v2-testing = { git = "https://github.com/otter-sec/anchor", rev = "7d28d8b5fde8d46b204ebf161c9db3956801146a" }
bytemuck = { version = "=1.25.2", features = ["derive", "min_const_generics"] }
pinocchio = { version = "=0.11.1", default-features = false, features = ["copy", "cpi"] }
sdp-intents-spec = { path = "../crates/spec" }
solana-instruction = { version = "=4.0.0", default-features = false, features = ["syscalls"] }
solana-sha256-hasher = { version = "=3.1.0", features = ["sha2"] }

[workspace.lints.rust]
unused_imports = "deny"
dead_code = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("idl-build", "custom-heap", "custom-panic", "anchor-debug", "cpi", "no-log-ix-name"))'] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
