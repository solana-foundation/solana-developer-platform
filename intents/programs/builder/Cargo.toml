[package]
name = "sdp-intents-builder"
description = "The builder library: what an SDP builder program writes, in staged mode and in hashed mode"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
bytemuck.workspace = true
pinocchio.workspace = true
sdp-intents-spec.workspace = true
solana-instruction.workspace = true
solana-sha256-hasher.workspace = true

# A program derives addresses through the syscalls. Elsewhere `curve25519` derives them in Rust.
[target.'cfg(target_os = "solana")'.dependencies]
solana-address = { version = "=2.7.0", features = ["syscalls"] }

[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-address = { version = "=2.7.0", features = ["curve25519"] }

[dev-dependencies]
solana-address = { version = "=2.7.0", features = ["curve25519", "decode"] }

[lints]
workspace = true
