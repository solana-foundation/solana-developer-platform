[package]
name = "jupiter-lend-builder"
description = "A builder for Jupiter Lend Earn deposits and withdrawals, for the vault.deposit and vault.withdraw interfaces"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["no-log-ix-name"]
no-entrypoint = []
cpi = ["no-entrypoint"]
idl-build = []
no-log-ix-name = []

[dependencies]
anchor-lang.workspace = true
bytemuck.workspace = true
pinocchio.workspace = true
sdp-intents-builder = { path = "../builder" }

# The Solana crates are the versions that LiteSVM 0.18 uses.
[dev-dependencies]
anchor-v2-testing.workspace = true
sdp-intents-planner = { path = "../../planner" }
sdp-intents-program-testing = { path = "../testing" }
sdp-intents-spec.workspace = true
solana-account = "=4.7.0"
solana-address = "=2.7.0"
solana-clock = "=3.2.1"

[lints]
workspace = true
