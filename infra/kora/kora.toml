# Kora configuration for the local/CI Kora-on-Surfpool harness.
# Mirrors the deployed devnet validation policy so tests exercise the same
# constraints; auth, cache, and metrics are trimmed for local use.

[kora]
rate_limit = 100

[kora.auth]
# No auth for local development

[kora.cache]
enabled = true
url = "redis://redis:6379"
default_ttl = 300
account_ttl = 60

[kora.enabled_methods]
liveness = true
estimate_transaction_fee = true
get_supported_tokens = true
sign_transaction = true
sign_and_send_transaction = true
transfer_transaction = true
get_blockhash = true
get_config = true
get_payer_signer = true

[validation]
max_allowed_lamports = 9900000  # 0.0099 SOL max per tx: a real token deploy funds ~9.08M lamports
                                # of rent, and the platform-side ceiling (network fee + this value)
                                # must stay under the 10M-lamport per-transaction sponsorship budget
max_signatures = 10
price_source = "Mock"
allow_durable_transactions = false

allowed_programs = [
    "11111111111111111111111111111111",              # System Program
    "TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA",   # Token Program (legacy)
    "TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb",  # Token-2022 Program
    "ATokenGPvbdGVxr1b2hvZbsiqW5xWH25efTNsLJA8knL",  # Associated Token Program
    "TACLkU6CiCdkQN2MjoyDkVg2yAH9zkxiHDsiztQ52TP",   # Token-ACL (sRFC-37)
    "GATEzzqxhJnsWF6vHRsgtixxSB8PaQdcqGEVTEHWiULz",  # ABL / GATE Program
    "SPLxh1LVZzEkX99H6rqYizhytLWPZVV296zyYDPagv2",   # MagicBlock private transfer program
    "DELeGGvXpWV2fqJUhqcF5ZSYMS4JTLjteaAMARRSaeSh",   # MagicBlock delegation program
    "De1egAFMkMWZSN5rYXRj9CAdheBamobVNubTsi9avR44",   # Subscriptions (recurring payments) program
    "MemoSq4gqABAXKb96qnH8TysNcWxMyWCqXgDLGmfcHr",   # Memo Program
    "AddressLookupTab1e1111111111111111111111111",   # Address Lookup Table
    "ComputeBudget111111111111111111111111111111",   # Compute Budget

    # ── Earn provider programs ──────────────────────────────────────────────
    # Sponsored Earn vault execution: SDP compiles a provider's instructions
    # with the Kora signer as fee payer, so every program a provider emits an
    # instruction for must appear here or Kora rejects the whole transaction.
    #
    # SOURCE OF TRUTH is code, not this file: each executing provider client
    # declares its programs (Kamino: `kaminoProgramAllowlist` in
    # packages/sdp-kamino/src/programs.ts, from the verified address table in
    # packages/sdp-types/src/kamino-programs.ts).
    # `vault-sponsorship-allowlist.test.ts` asserts THIS list is a superset of
    # every declaration on every CI run. The live Kora smoke suite makes the
    # same assertion against the DEPLOYED allowlist, and stays opt-in until
    # sdp-infra#64 puts the ids on devnet Kora. Add a provider's programs here
    # and to both configs in sdp-infra.
    #
    # Kamino. Note kvault is PER-CLUSTER: this harness runs devnet, and the
    # mainnet id must not be pasted here (see kamino-programs.ts on why the
    # wrong one fails silently rather than loudly).
    "devkRngFnfp4gBc5a3LsadgbQKdPo8MSZ4prFiNSVmY",   # Kamino K-Vault (devnet)
    "KLend2g3cP87fffoy8q1mQqGKjrxjC8boSyAYavgmjD",   # Kamino Lending (both clusters)
    "FarmsPZpWu9i7Kky8tPN37rs2TpmMrAZrC7S7vJa91Hr",  # Kamino Farms (both clusters)

    # Veda (`vedaProgramAllowlist` in packages/sdp-veda/src/programs.ts, from
    # the confirmed deployment in packages/sdp-types/src/veda-programs.ts).
    # Veda deploys the same addresses on both clusters, measured per cluster by
    # the genesis proof before any read.
    "ASN8Cz36kQSZf2ZrgUbRShaKUpN4CJoTGdv6C5uMsy3J",  # Veda boring_vault_svm
    "fh8uapqMe4GWhep9rt9qZ56Pxi9SYszkuDKXckYMQTT",   # Veda boring_onchain_queue
    "BmTjMtZGcvx5XB7LwRaGq3x9hdHG1SziYikjP9BAgoE2",  # Veda share-mint transfer hook
    "Ed25519SigVerify111111111111111111111111111",   # Ed25519 sig-verify (Veda deposit plans)
]

# Native SOL (wrapped) is required for fee payment
allowed_tokens = ["So11111111111111111111111111111111111111112"]

# SPL tokens that can be used to pay fees (empty for SOL-only)
allowed_spl_paid_tokens = []

disallowed_accounts = []

[validation.fee_payer_policy]

[validation.fee_payer_policy.system]
# The fee payer funds rent for token deploys (System Transfer / CreateAccount).
# Outflow is bounded by max_allowed_lamports per transaction and the platform's
# sponsorship budgets.
allow_transfer = true
allow_assign = false
allow_create_account = true
allow_allocate = false

[validation.fee_payer_policy.system.nonce]
allow_initialize = false
allow_advance = false
allow_authorize = false
allow_withdraw = false

[validation.fee_payer_policy.spl_token]
allow_transfer = false
allow_burn = false
allow_close_account = false
allow_approve = false
allow_revoke = false
allow_set_authority = false
allow_mint_to = false
allow_initialize_mint = false
allow_initialize_account = false
allow_initialize_multisig = false
allow_freeze_account = false
allow_thaw_account = false

[validation.fee_payer_policy.token_2022]
allow_transfer = false
allow_burn = false
allow_close_account = false
allow_approve = false
allow_revoke = false
allow_set_authority = false
allow_mint_to = false
allow_initialize_mint = false
allow_initialize_account = false
allow_initialize_multisig = false
allow_freeze_account = false
allow_thaw_account = false

[validation.price]
type = "free"

[validation.token2022]
allow_confidential_transfers = true
blocked_mint_extensions = []
blocked_account_extensions = []
allow_token_metadata_instructions = true
allow_token_group_instructions = true

[metrics]
enabled = false
